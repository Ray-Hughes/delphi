name: Release

# Tag a version and this builds the installers and puts them on the release.
#
#   npm version 1.0.1 && git push --follow-tags
#
# Each platform is built on its own runner because neither can produce the other's
# installer without help: a Windows installer built on macOS needs Wine, and a mac
# build cannot be signed or made into a dmg anywhere but macOS.
#
# Nothing is published until both have finished. Letting each runner publish its
# own output looks simpler and is how v1.0.0 lost its Windows installer: both jobs
# asked GitHub to create a release for the same tag at the same time, neither saw
# the other's, and GitHub happily made two drafts. The mac assets went into one and
# the exe into the other, so publishing the visible one produced a release that
# offered Windows users a 404.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not throw away the other's build, which may
      # have taken ten minutes and be perfectly good.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS
            args: --mac
          - os: windows-latest
            name: Windows
            args: --win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build
        # Never published from here. This job's only output is files.
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Signing, for when there are certificates to sign with. Every one of
          # these is empty today, and electron-builder treats an empty signing
          # variable as "do not sign" rather than as an error, so this block is
          # inert until the secrets exist. Adding them is then a settings change
          # rather than a workflow rewrite.
          #
          # macOS needs CSC_LINK (a base64 .p12), its password, and the three
          # notarisation values. Windows needs the same first two with its own
          # certificate. tools/after-pack.js stands down as soon as CSC_LINK is
          # set, so the ad-hoc signature it applies cannot overwrite a real one.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    # Only for a tag. A manual run is for checking the build still works, and
    # should not create a release from whatever happens to be on the branch.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Check both platforms are here
        # A release missing one platform is worse than no release: the download
        # page offers the file either way, and the visitor gets a 404 rather than
        # a message. Better to fail loudly and leave the previous release as the
        # latest one.
        run: |
          ls -lh installers
          for required in "*.dmg" "*.exe"; do
            count=$(find installers -name "$required" -type f | wc -l)
            [ "$count" -gt 0 ] || { echo "No file matching $required was built"; exit 1; }
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(cat <<'BODY'
          Download for your platform below, or from https://ray-hughes.github.io/delphi/

          | Platform | File |
          | --- | --- |
          | macOS, Apple Silicon | `Delphi-mac-arm64.dmg` |
          | macOS, Intel | `Delphi-mac-x64.dmg` |
          | Windows 10 and 11 | `Delphi-Setup.exe` |

          **The first launch will stop you once.** These builds are not signed with a
          paid certificate yet.

          On macOS, open it and click **Done** on the warning, not Move to Trash. Then
          go to System Settings, Privacy and Security, and click **Open Anyway** next to
          the message about Delphi. Or clear the flag directly:
          `xattr -dr com.apple.quarantine /Applications/Delphi.app`

          On Windows, click **More info** and then **Run anyway**.

          The other files are for a future auto updater and can be ignored.
          BODY
          )
          # Created and filled in one call, so the release is never briefly visible
          # holding one platform's files.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" installers/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Delphi ${TAG#v}" \
              --notes "$notes"
          fi
