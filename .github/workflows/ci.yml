name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Safety guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The guard is the one component where a regression is dangerous rather
      # than inconvenient, so it is tested on both sides: every command it must
      # block, and every nearby command it must not.
      - name: Run the guard test suite
        run: python3 agent/guard_test.py

  # Every tools/*_test.js and agent/*_test.py, through tools/test_all.js, which is
  # what `npm test` runs. That includes tools/package_test.js, which copies the
  # extraResources layout into a temp Resources/ folder and starts the MCP server
  # from it: the check that would have caught the server shipping without
  # agent/directives.js.
  #
  # Ubuntu rather than macOS. The tests run under Electron's binary with
  # ELECTRON_RUN_AS_NODE=1, which opens no window, so there is nothing a mac
  # runner would add except ten times the cost per minute. xvfb is installed for
  # the day a test declares the full Electron runtime, and test_all.js wraps such
  # a test in xvfb-run itself, so a plain `npm test` stays the command here and
  # on a laptop. sqlite3 because the MCP server falls back to the binary on a
  # Node without node:sqlite, and the tests exercise that route on purpose. A
  # default branch and an identity because the Workbench tests make throwaway
  # repositories, and git on a fresh runner has neither.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools the tests need
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q sqlite3 xvfb
          git config --global init.defaultBranch main
          git config --global user.name "Delphi CI"
          git config --global user.email "ci@delphi.invalid"
      - run: npm ci
      - name: npm test
        run: npm test

  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Catches the class of error that otherwise only appears when a user
      # double-clicks the Desktop icon and nothing happens.
      - name: Shell scripts
        run: |
          for f in install/*.sh oracle-launcher; do
            [ -f "$f" ] && bash -n "$f" && echo "ok  $f"
          done

      # The Windows installer script, parsed rather than run. PowerShell is on the
      # Ubuntu runners, and a syntax error here would otherwise surface only on
      # someone else's Windows machine.
      - name: PowerShell scripts
        run: |
          for f in install/*.ps1; do
            [ -f "$f" ] || continue
            pwsh -NoProfile -Command "
              \$errors = \$null
              [System.Management.Automation.Language.Parser]::ParseFile('$f', [ref]\$null, [ref]\$errors) > \$null
              if (\$errors) { \$errors | ForEach-Object { Write-Error \$_ }; exit 1 }
            " && echo "ok  $f"
          done

      # By glob rather than by list. The list this replaced named ten files and
      # had fallen behind the repository, which is the failure it exists to catch.
      - name: JavaScript
        run: |
          shopt -s nullglob globstar
          for f in *.js agent/*.js tools/*.js sheet/**/*.js workbench/**/*.js bin/delphi; do
            [ -f "$f" ] || continue
            node --check "$f" && echo "ok  $f"
          done

      - name: JSON
        run: |
          for f in package.json .vscode/mcp.json; do
            [ -f "$f" ] && python3 -m json.tool "$f" > /dev/null && echo "ok  $f"
          done

      # A broken build configuration otherwise announces itself on release day,
      # which is the worst moment to find out.
      - name: Build configuration
        run: |
          npm ci
          node -e "
            const fs = require('fs');
            // Checked in both modes, because the signed one only comes to life
            // on a release runner and would otherwise be exercised for the first
            // time by a real release.
            for (const signing of [false, true]) {
              if (signing) process.env.CSC_LINK = 'test'; else delete process.env.CSC_LINK;
              delete require.cache[require.resolve('./electron-builder.config.js')];
              // Whether every path it names exists is checked by
              // tools/package_test.js in the test job, which knows which paths
              // are wired ahead of the code that will fill them.
              const config = require('./electron-builder.config.js');
              if (signing && !config.mac.notarize) throw new Error('signing mode should notarise');
              if (signing && config.mac.entitlements && !fs.existsSync(config.mac.entitlements)) {
                throw new Error('missing entitlements: ' + config.mac.entitlements);
              }
              if (!signing && config.mac.identity !== null) throw new Error('unsigned mode must set identity null');
            }
            console.log('ok  electron-builder.config.js, both signing modes');
          "

      # The database holds work content rather than code. It reached a public
      # repository once because .gitignore still named the file by its old
      # name, so this is checked rather than trusted.
      - name: No database committed
        run: |
          if git ls-files | grep -E '\.db(-wal|-shm)?$'; then
            echo "A database file is tracked. Remove it with: git rm --cached <file>"
            exit 1
          fi
          echo "ok  no database tracked"
