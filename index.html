<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Delphi</title>
<link rel="stylesheet" href="assets/fonts.css" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/app.css" />
<link rel="stylesheet" href="styles/recovery.css" />
<link rel="stylesheet" href="styles/topbar.css" />
<link rel="stylesheet" href="styles/folders.css" />
<link rel="stylesheet" href="styles/settings.css" />
<link rel="stylesheet" href="styles/ledger.css" />
<link rel="stylesheet" href="styles/today.css" />
<link rel="stylesheet" href="styles/tasks.css" />
<link rel="stylesheet" href="styles/memory.css" />
<link rel="stylesheet" href="styles/weekly.css" />
<link rel="stylesheet" href="styles/focus.css" />
<link rel="stylesheet" href="styles/drawer.css" />
<link rel="stylesheet" href="styles/markdown.css" />
<link rel="stylesheet" href="styles/layout.css" />
<link rel="stylesheet" href="styles/report.css" />
<!-- pointer.css stays last: it overrides the arrow cursor everything above sets. -->
<link rel="stylesheet" href="styles/pointer.css" />
</head>
<body>
  <!-- Direction B: one top area and no sidebar. The switcher, the bar, the
       tabs and the buttons on the right are painted by ui/topbar.js; #tb-live
       is still paintTitleLive()'s, from the same list the Runs page reads. -->
  <header class="top" id="top">
    <div class="top-row">
      <!-- Home: Today across every project, from anywhere, always in the same
           place. ui/topbar.js paints its state; G then H does the same. -->
      <button class="home-btn" id="home-btn" type="button" aria-label="Home">
        <img class="top-mark" src="assets/mark-64.png" alt="" width="26" height="26" />
        <span class="home-label">Home</span>
      </button>
      <div id="switcher"></div>
      <span class="grow"></span>
      <div id="bar"></div>
      <span class="grow"></span>
      <div id="live"><button class="tb-live" id="tb-live" type="button" hidden></button></div>
      <div id="focus-entry"></div>
      <div id="top-acts"></div>
      <!-- What the old search field held. app.js still reads and clears it
           around a search, and the bar writes the query into it. -->
      <input id="search" type="search" hidden aria-hidden="true" tabindex="-1" />
    </div>
    <nav class="tabs-b" id="viewtabs" aria-label="Views"></nav>
  </header>

  <div class="body">
    <!-- Not drawn in Direction B. Kept, hidden, until the cleanup slice, so the
         code that still paints it has its elements and a revert is one line. -->
    <nav class="sidebar" hidden>
      <!-- Places, then projects: Today, Needs you, Runs, All work and Memory,
           then pinned, active and everything else. One column, no rail: a
           folder is something a project has, not a level above it. -->
      <div class="sidebar-scroll">
        <div id="projects"></div>
      </div>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </nav>

    <main class="main">
      <div class="head">
        <div class="head-top">
          <button class="back" id="back" title="Back (Command + [)" aria-label="Back" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <button class="back fwd" id="fwd" title="Forward (Command + ])" aria-label="Forward" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <div class="grow">
            <nav class="crumbs" id="crumbs" aria-label="Breadcrumb" hidden></nav>
            <h1 id="title">Loading</h1>
            <div class="sub" id="subtitle"></div>
          </div>
          <div class="metrics" id="metrics"></div>
        </div>
        <div class="tabs" id="tabs"></div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- Before app.js, which reads window.delphiTime at load. Its own file so
       tools/time_test.js can require the same code under Node. -->
  <script src="timefmt.js"></script>
  <!-- The shared helpers ($, el), before anything that builds DOM. -->
  <script src="ui/core.js"></script>
  <!-- Picking up after any exit: the place, drafts, the banner, backups. -->
  <script src="ui/recovery.js"></script>
  <script src="ui/backups.js"></script>
  <!-- The Direction B shell: icons, the command registry, the Cmd+K bar, the
       keys and the top area. Before app.js, which hands them its callbacks. -->
  <script src="ui/icons.js"></script>
  <script src="ui/commands.js"></script>
  <script src="ui/palette.js"></script>
  <script src="ui/keys.js"></script>
  <script src="ui/topbar.js"></script>
  <!-- Folders: Add folder as project, the fix-it bar, and the folder
       questions in Needs you. Before app.js, which lends them its callbacks. -->
  <script src="ui/addfolder.js"></script>
  <script src="ui/needs.js"></script>
  <!-- A project's Folders list, the "Filed under" chip and the drawer's folder
       picker (ui/folderlist.js). Before app.js, which lends it its callbacks. -->
  <script src="ui/folderlist.js"></script>
  <!-- Settings: the one list of settings, then the floating panel built from it. -->
  <script src="settings/schema.js"></script>
  <script src="ui/settings.js"></script>
  <!-- Edit this page: the layout model and the editor. Before the pages that
       register their sections with it (today.js, tasks.js, app.js's Runs). -->
  <script src="ui/layout.js"></script>
  <!-- The cost and time ledger: the shared sums and words, then its cards. -->
  <script src="ledger/ledger.js"></script>
  <script src="ui/ledger.js"></script>
  <!-- Today, the home tab: stuck tasks, the brief, your day. -->
  <script src="ui/today.js"></script>
  <!-- Tasks: quick entry, inline edit, subtask pills, List or Kanban. -->
  <script src="ui/tasks.js"></script>
  <script src="ui/memory.js"></script>
  <!-- The weekly review: look back, tidy, next week. Reached from Today and Cmd+K. -->
  <script src="ui/weekly.js"></script>
  <!-- Focus mode: one task, Interruption, delegation and Break. -->
  <script src="ui/focus.js"></script>
  <!-- Markdown: the one renderer, and the colours of its code blocks. -->
  <script src="ui/highlight.js"></script>
  <script src="ui/markdown.js"></script>
  <!-- The PR description and status report editor: Finish, the drawer, Write status. -->
  <script src="ui/report.js"></script>
  <!-- The drawer: a task, a note or a pad as one document. -->
  <script src="ui/drawer.js"></script>
  <script src="app.js"></script>
</body>
</html>
