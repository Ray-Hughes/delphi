<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Brain</title>
<style>
  :root {
    --bg: rgba(28, 30, 36, 0.72);
    --panel: rgba(255, 255, 255, 0.04);
    --panel-hi: rgba(255, 255, 255, 0.08);
    --line: rgba(255, 255, 255, 0.10);
    --ink: #eceef3;
    --ink-dim: #9aa3b2;
    --ink-faint: #6b7484;
    --accent: #5b9bf8;
    --high: #f0806a;
    --med: #e2b35c;
    --low: #6b7484;
    --good: #63c088;
    --radius: 10px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: rgba(246, 247, 250, 0.78);
      --panel: rgba(0, 0, 0, 0.035);
      --panel-hi: rgba(0, 0, 0, 0.07);
      --line: rgba(0, 0, 0, 0.10);
      --ink: #1c2028;
      --ink-dim: #58606e;
      --ink-faint: #868e9c;
      --accent: #2f6fd0;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: var(--font);
    font-size: 13px;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* Draggable strip so a frameless window can still be moved. */
  .titlebar {
    height: 34px; flex: 0 0 34px;
    -webkit-app-region: drag;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--line);
    gap: 10px; padding: 0 12px;
  }
  .titlebar .search { -webkit-app-region: no-drag; width: min(460px, 60%); }
  input, textarea, select, button { font-family: inherit; font-size: inherit; color: inherit; }
  .search input {
    width: 100%; padding: 5px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    outline: none;
  }
  .search input:focus { border-color: var(--accent); background: var(--panel-hi); }

  .body { flex: 1; display: flex; min-height: 0; }

  /* Sidebar ------------------------------------------------------------- */
  .sidebar {
    width: 232px; flex: 0 0 232px;
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sidebar-scroll { overflow-y: auto; flex: 1; padding: 8px; }
  .side-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--ink-faint); padding: 10px 8px 6px;
  }
  .proj {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 8px; border-radius: 7px; cursor: default;
    -webkit-user-select: none; user-select: none;
  }
  .proj:hover { background: var(--panel); }
  .proj.active { background: var(--panel-hi); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
  .proj-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count {
    font-variant-numeric: tabular-nums; font-size: 11px;
    color: var(--ink-faint); background: var(--panel); padding: 1px 6px; border-radius: 20px;
  }
  .proj.active .count { color: var(--ink-dim); }

  .sidebar-foot { border-top: 1px solid var(--line); padding: 8px; }
  .btn {
    -webkit-app-region: no-drag;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink-dim);
    padding: 5px 9px; border-radius: 7px; cursor: default; width: 100%;
  }
  .btn:hover { background: var(--panel-hi); color: var(--ink); }
  .btn.sm { width: auto; padding: 3px 8px; font-size: 12px; }

  /* Main ---------------------------------------------------------------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .head { padding: 14px 18px 0; }
  .head h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .head .sub { color: var(--ink-dim); margin-top: 3px; }
  .tabs { display: flex; gap: 2px; margin-top: 12px; border-bottom: 1px solid var(--line); }
  .tab {
    padding: 6px 11px; border-radius: 7px 7px 0 0; color: var(--ink-dim);
    cursor: default; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }
  .tab .n { color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  .content { flex: 1; overflow-y: auto; padding: 12px 18px 18px; min-height: 0; }

  /* Tasks --------------------------------------------------------------- */
  .task {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px; border-radius: var(--radius); border: 1px solid transparent;
  }
  .task:hover { background: var(--panel); border-color: var(--line); }
  .check {
    width: 15px; height: 15px; flex: 0 0 15px; margin-top: 1px;
    border-radius: 4px; border: 1.5px solid var(--ink-faint); cursor: default;
    display: grid; place-items: center; font-size: 10px; color: transparent;
  }
  .check:hover { border-color: var(--accent); }
  .task.done .check { background: var(--good); border-color: var(--good); color: #0d1a12; }
  .task.done .t-title { text-decoration: line-through; color: var(--ink-faint); }
  .t-body { flex: 1; min-width: 0; }
  .t-title { line-height: 1.4; }
  .t-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }
  .chip {
    font-size: 11px; padding: 1px 6px; border-radius: 20px;
    background: var(--panel); color: var(--ink-faint); border: 1px solid var(--line);
  }
  .chip.high { color: var(--high); border-color: color-mix(in srgb, var(--high) 40%, transparent); }
  .chip.med  { color: var(--med); }
  .chip.doing { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .chip.blocked { color: var(--high); }
  .chip.overdue { color: var(--high); border-color: color-mix(in srgb, var(--high) 45%, transparent); }
  .chip.ref { font-family: var(--mono); font-size: 10.5px; }
  .t-detail {
    margin-top: 6px; color: var(--ink-dim); white-space: pre-wrap;
    font-size: 12px; line-height: 1.5; max-height: 130px; overflow: auto;
    border-left: 2px solid var(--line); padding-left: 9px;
  }
  .t-actions { display: flex; gap: 4px; opacity: 0; }
  .task:hover .t-actions { opacity: 1; }

  /* Notes --------------------------------------------------------------- */
  .note {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px; margin-bottom: 8px; background: var(--panel);
  }
  .note h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .note .b {
    white-space: pre-wrap; color: var(--ink-dim); font-size: 12px; line-height: 1.55;
  }
  .note textarea, .note input {
    width: 100%; background: transparent; border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 8px; outline: none; resize: vertical;
  }
  .note textarea:focus, .note input:focus { border-color: var(--accent); }

  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
  .add-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .add-row input {
    flex: 1; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); outline: none;
  }
  .add-row input:focus { border-color: var(--accent); }
  .empty { color: var(--ink-faint); padding: 26px 4px; text-align: center; }
  .hint { color: var(--ink-faint); font-size: 11px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .link-row { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 7px; }
  .link-row:hover { background: var(--panel); }
  /* Hotkey recorder ----------------------------------------------------- */
  .recorder {
    display: grid; place-items: center; gap: 6px;
    padding: 22px; border: 2px dashed var(--line); border-radius: var(--radius);
    background: var(--panel); cursor: default; -webkit-user-select: none; user-select: none;
  }
  .recorder.armed { border-color: var(--accent); background: var(--panel-hi); }
  .keys { display: flex; gap: 5px; align-items: center; }
  .key {
    font-family: var(--mono); font-size: 15px; padding: 5px 11px;
    border-radius: 7px; background: var(--panel-hi);
    border: 1px solid var(--line); border-bottom-width: 2px;
  }
  .setting-block {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 12px; background: var(--panel);
  }
  .setting-block h3 { margin: 0 0 3px; font-size: 13px; }
  .setting-block p { margin: 0 0 12px; color: var(--ink-dim); font-size: 12px; line-height: 1.55; }
  .audit-row {
    display: flex; gap: 10px; align-items: baseline;
    padding: 7px 8px; border-radius: 7px; border-bottom: 1px solid var(--line);
  }
  .audit-row:hover { background: var(--panel); }
  .audit-row.undone { opacity: 0.45; }
  .audit-when { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); flex: 0 0 118px; }
  .audit-what { flex: 1; min-width: 0; }
  .audit-what .lbl { color: var(--ink-dim); }
  .ok-msg { color: var(--good); font-size: 12px; }
  .err-msg { color: var(--high); font-size: 12px; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-hi); border-radius: 5px; }
</style>
</head>
<body>
  <div class="titlebar">
    <div class="search"><input id="search" type="search" placeholder="Search tasks and memory   (Esc to close)" /></div>
  </div>

  <div class="body">
    <aside class="sidebar">
      <div class="sidebar-scroll">
        <div class="side-label">Projects</div>
        <div id="projects"></div>
      </div>
      <div class="sidebar-foot">
        <button class="btn" id="new-project">New project</button>
        <div class="hint" id="stats" style="margin-top:8px"></div>
      </div>
    </aside>

    <main class="main">
      <div class="head">
        <h1 id="title">Loading</h1>
        <div class="sub" id="subtitle"></div>
        <div class="tabs">
          <div class="tab active" data-tab="tasks">Tasks <span class="n" id="n-tasks"></span></div>
          <div class="tab" data-tab="notes">Memory <span class="n" id="n-notes"></span></div>
          <div class="tab" data-tab="links">Links <span class="n" id="n-links"></span></div>
          <div class="tab" data-tab="audit">History</div>
          <div class="tab" data-tab="settings">Settings</div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
