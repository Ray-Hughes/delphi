<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Delphi</title>
<style>
  /* Tokens ---------------------------------------------------------------
     Light is the base set; dark redefines the same names. Components only
     ever reference tokens, so neither theme can end up with one theme's ink
     on the other's ground. */
  :root {
    --bg:        #f4f6f9;
    --surface:   #ffffff;
    --raised:    #eef1f6;
    --line:      #dde2ea;
    --line-soft: #e8ecf2;

    --ink:       #171b23;
    --ink-dim:   #5a6376;
    --ink-faint: #8d97a9;

    --accent:      #4a63d8;
    --accent-soft: #e6eaff;
    --good:      #2f8757;
    --warn:      #a8700f;
    --crit:      #c04a41;

    /* Spacing scale. Everything uses these, so rhythm stays consistent
       rather than being decided per component. */
    --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
    --s5: 24px; --s6: 32px; --s7: 48px;

    --r-sm: 6px; --r: 10px; --r-lg: 14px;

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;

    --shadow: 0 1px 2px rgba(16, 20, 28, 0.05), 0 4px 16px rgba(16, 20, 28, 0.06);
  }

  /* The dark set is declared once and applied from two places: when the system
     asks for dark and the user has not overridden it, and when the user has
     chosen dark outright. Following the system stays the default, so an
     untouched install behaves exactly as it did before the setting existed. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #0f1217;
      --surface:   #171b23;
      --raised:    #1f242f;
      --line:      #2a3040;
      --line-soft: #222836;

      --ink:       #e6e9ef;
      --ink-dim:   #98a1b2;
      --ink-faint: #6a7385;

      --accent:      #7c9bff;
      --accent-soft: #1e2740;
      --good:      #4fb477;
      --warn:      #e0a458;
      --crit:      #e2685f;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.28);
    }
  }

  :root[data-theme="dark"] {
    --bg:        #0f1217;
    --surface:   #171b23;
    --raised:    #1f242f;
    --line:      #2a3040;
    --line-soft: #222836;

    --ink:       #e6e9ef;
    --ink-dim:   #98a1b2;
    --ink-faint: #6a7385;

    --accent:      #7c9bff;
    --accent-soft: #1e2740;
    --good:      #4fb477;
    --warn:      #e0a458;
    --crit:      #e2685f;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.28);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  input, textarea, select, button { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); background-clip: content-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* Title bar ------------------------------------------------------------ */
  .titlebar {
    height: 46px; flex: 0 0 46px;
    -webkit-app-region: drag;
    display: flex; align-items: center; gap: var(--s3);
    padding: 0 var(--s5);
    transition: padding 120ms ease;
    border-bottom: 1px solid var(--line-soft);
    background: var(--surface);
  }
  /* Room for the window buttons, on whichever side the platform puts them.
     macOS insets its traffic lights into the left of this bar. Windows draws its
     minimise, maximise and close over the right of it. Neither is visible to the
     stylesheet, so the class comes from the main process, which is the only place
     that knows. */
  body.mac .titlebar { padding-left: 88px; }
  body.overlay .titlebar { padding-right: 148px; }
  .search { -webkit-app-region: no-drag; flex: 1; max-width: 520px; position: relative; }
  /* The field sat a shade darker than the bar it lives in, with a hairline
     border, so on a dark ground it read as empty space rather than as somewhere
     to type. It now carries a visible edge at rest and a ring on focus. */
  .search input {
    width: 100%; padding: 8px 12px 8px 32px;
    border-radius: var(--r-sm);
    border: 1px solid var(--ink-faint);
    background: var(--bg); color: var(--ink); outline: none;
    transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search input:hover { border-color: var(--ink-dim); }
  .search input:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .search::before {
    content: "⌕"; position: absolute; left: 11px; top: 50%; transform: translateY(-52%);
    color: var(--ink-faint); font-size: 15px; pointer-events: none;
  }
  .titlebar .spacer { flex: 1; }
  /* A frameless panel has no traffic lights to avoid. */
  body.panel .titlebar { padding-left: var(--s5); }

  .body { flex: 1; display: flex; min-height: 0; }

  /* Identity ------------------------------------------------------------- */
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: var(--s4) var(--s4) var(--s3);
    -webkit-app-region: drag;
  }
  /* The app's own icon, rather than a gradient square standing in for it. The 2x
     file is drawn at 26px so it stays sharp on a retina display. */
  .mark {
    width: 26px; height: 26px; flex: 0 0 26px; border-radius: 8px;
    display: block;
    box-shadow: 0 2px 8px rgba(16, 20, 28, 0.28);
  }
  .wordmark { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .wordmark .sub {
    display: block; font-size: 10px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint); margin-top: -1px;
  }

  /* Sidebar -------------------------------------------------------------- */
  .sidebar {
    width: 254px; flex: 0 0 254px;
    background: var(--surface);
    border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sidebar-scroll { overflow-y: auto; flex: 1; padding: var(--s3); }
  .side-label {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--ink-faint); padding: var(--s3) var(--s2) var(--s2);
  }
  .proj {
    display: flex; align-items: center; gap: var(--s3);
    padding: 9px var(--s3); border-radius: var(--r-sm);
    cursor: default; -webkit-user-select: none; user-select: none;
    transition: background 100ms ease;
  }
  .proj:hover { background: var(--raised); }
  .proj.active { background: var(--accent-soft); }
  .proj.active .proj-name { color: var(--accent); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; }
  .proj-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count {
    font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600;
    color: var(--ink-faint); min-width: 20px; text-align: right;
  }
  .sidebar-foot { border-top: 1px solid var(--line-soft); padding: var(--s3); }

  /* Buttons -------------------------------------------------------------- */
  .btn {
    -webkit-app-region: no-drag;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink-dim);
    padding: 7px 13px; border-radius: var(--r-sm); cursor: default;
    transition: background 100ms ease, border-color 100ms ease, color 100ms ease;
  }
  .btn:hover { background: var(--raised); color: var(--ink); border-color: var(--ink-faint); }
  .btn.wide { width: 100%; }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }

  /* Main ----------------------------------------------------------------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .head { padding: var(--s5) var(--s6) 0; background: var(--surface); border-bottom: 1px solid var(--line-soft); }
  .head-top { display: flex; align-items: flex-start; gap: var(--s4); }
  .head h1 {
    margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .head .sub { color: var(--ink-dim); margin-top: 5px; max-width: 68ch; }

  /* Sits beside the title rather than in the toolbar, so it reads as "back from
     this thing" rather than as a global control. Hidden with the hidden
     attribute when there is nowhere to go, because a permanently dead button
     teaches people to ignore it. */
  .back {
    flex: 0 0 auto; margin-top: 3px;
    width: 30px; height: 30px; padding: 0;
    display: grid; place-items: center;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-dim); cursor: default;
    transition: background 100ms ease, color 100ms ease, border-color 100ms ease;
  }
  .back[hidden] { display: none; }
  .back:hover { background: var(--raised); color: var(--ink); border-color: var(--ink-faint); }
  .back:active { background: var(--raised); }
  .back svg { width: 16px; height: 16px; }

  /* Header metrics. Compact siblings of the dashboard tiles: same information
     design, less weight, so they read as context rather than as content. */
  .metrics { display: flex; gap: var(--s5); flex: 0 0 auto; padding-top: 4px; }
  .metric { text-align: right; min-width: 54px; }
  .metric .v {
    font-size: 20px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .metric .k {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-faint); font-weight: 600; margin-top: 2px;
  }
  .metric.warn .v { color: var(--warn); }
  .metric.crit .v { color: var(--crit); }
  .metric.good .v { color: var(--accent); }
  .metric.zero .v { color: var(--ink-faint); font-weight: 500; }
  @media (max-width: 900px) { .metrics { display: none; } }
  .tabs { display: flex; gap: var(--s1); margin-top: var(--s5); }
  .tab {
    padding: 8px var(--s3); color: var(--ink-dim); cursor: default;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color 100ms ease, border-color 100ms ease;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab .n { color: var(--ink-faint); font-variant-numeric: tabular-nums; font-weight: 400; margin-left: 3px; }

  .content { flex: 1; overflow-y: auto; padding: var(--s5) var(--s6) var(--s7); min-height: 0; }

  /* Oracle --------------------------------------------------------------- */
  .oracle-bar {
    display: flex; gap: var(--s2); align-items: center; margin-bottom: var(--s4);
  }
  .oracle-input {
    flex: 1; padding: 11px 14px; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--surface); outline: none;
    font-size: 14px;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .oracle-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .provider-tag {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    color: var(--ink-faint); padding: 4px 9px; border-radius: 20px;
    border: 1px solid var(--line); white-space: nowrap;
  }
  .provider-tag.neural { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

  .hit { display: flex; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft); }
  .hit:last-child { border-bottom: 0; }
  .hit:hover { background: var(--raised); }
  /* The score is a bar as well as a number: a column of bars is scannable in a
     way a column of decimals is not. */
  .score { flex: 0 0 46px; padding-top: 3px; }
  .score .n { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .score .bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 4px; overflow: hidden; }
  .score .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .hit-body { flex: 1; min-width: 0; }
  .hit-title { font-weight: 550; }
  .hit-snip { color: var(--ink-dim); font-size: 12.5px; line-height: 1.55; margin-top: 4px; }

  .entity-cloud { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .ent {
    font-size: 12px; padding: 4px 10px; border-radius: 20px;
    background: var(--raised); border: 1px solid transparent; cursor: default;
    transition: border-color 100ms ease, color 100ms ease;
  }
  .ent:hover { border-color: var(--accent); color: var(--accent); }
  .ent b { font-weight: 600; }
  .ent .c { color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-left: 5px; font-size: 11px; }

  /* Dashboard ------------------------------------------------------------ */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--s3); margin-bottom: var(--s5); }
  .stat {
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--r); padding: var(--s4) var(--s4) var(--s3);
  }
  .stat .v { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin-top: 5px; font-weight: 600; }
  .stat.warn .v { color: var(--warn); }
  .stat.crit .v { color: var(--crit); }
  .stat.good .v { color: var(--good); }

  /* A tile that filters the task list has to look like it does something before
     it is hovered, or nobody discovers it. The arrow carries that at rest and
     the whole tile lifts on hover. A tile leading nowhere -- a count of zero --
     keeps the flat treatment rather than promising a view with nothing in it. */
  .stat.act {
    cursor: default; position: relative;
    text-align: left; width: 100%; font: inherit; color: inherit;
    transition: border-color 100ms ease, background 100ms ease, transform 100ms ease;
  }
  .stat.act::after {
    content: "→"; position: absolute; top: var(--s3); right: var(--s3);
    color: var(--ink-faint); font-size: 12px; opacity: 0.55;
    transition: opacity 100ms ease, transform 100ms ease, color 100ms ease;
  }
  .stat.act:hover, .stat.act:focus-visible {
    background: var(--raised); border-color: var(--ink-faint); transform: translateY(-1px);
  }
  .stat.act:hover::after, .stat.act:focus-visible::after {
    opacity: 1; color: var(--accent); transform: translateX(2px);
  }
  .stat.act:active { transform: translateY(0); }

  /* Segmented control ------------------------------------------------------
     Used where a setting has three or fewer states and seeing the alternatives
     matters as much as seeing the current one. */
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--raised); border-radius: var(--r-sm); border: 1px solid var(--line-soft); }
  .seg button {
    background: transparent; border: 1px solid transparent; color: var(--ink-dim);
    padding: 5px 12px; border-radius: 5px; cursor: default;
    transition: background 100ms ease, color 100ms ease;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] {
    background: var(--surface); color: var(--ink); font-weight: 600;
    border-color: var(--line); box-shadow: 0 1px 2px rgba(16, 20, 28, 0.06);
  }

  /* Active filter, shown so a filtered list never looks like an empty one. */
  .filter-note { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3); color: var(--ink-dim); }

  /* Rendered markdown ------------------------------------------------------
     Memory notes are written as markdown by agents and read by people. These
     are deliberately tight: the note is the content, so headings do not need
     display sizes. */
  .md { line-height: 1.65; overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3 { margin: var(--s5) 0 var(--s2); font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
  .md h1 { font-size: 17px; }
  .md h2 { font-size: 15px; }
  .md h3 { font-size: 13.5px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.05em; font-size: 11.5px; }
  .md p { margin: 0 0 var(--s3); }
  .md ul, .md ol { margin: 0 0 var(--s3); padding-left: var(--s5); }
  .md li { margin-bottom: 5px; }
  .md code {
    font-family: var(--mono); font-size: 12px;
    background: var(--raised); padding: 1.5px 5px; border-radius: 4px;
  }
  .md pre {
    background: var(--raised); border: 1px solid var(--line-soft); border-radius: var(--r);
    padding: var(--s3) var(--s4); overflow-x: auto; margin: 0 0 var(--s3);
  }
  .md pre code { background: none; padding: 0; font-size: 12px; line-height: 1.6; }
  .md blockquote {
    margin: 0 0 var(--s3); padding: 2px 0 2px var(--s4);
    border-left: 2px solid var(--line); color: var(--ink-dim);
  }
  .md hr { border: 0; border-top: 1px solid var(--line-soft); margin: var(--s5) 0; }
  /* Notes lean on tables heavily, and a wide one must scroll inside the note
     rather than stretching the pane it lives in. */
  .md .table-wrap { overflow-x: auto; margin: 0 0 var(--s3); }
  .md table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .md th, .md td { border: 1px solid var(--line-soft); padding: 6px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--raised); font-weight: 600; white-space: nowrap; }
  .md strong { font-weight: 650; }

  /* The rendered pane inside the full-size sheet gets the same frame the
     textarea has, so toggling does not move the content. */
  .sheet-body .md {
    flex: 1; overflow-y: auto;
    border: 1px solid var(--line); border-radius: var(--r);
    background: var(--bg); padding: var(--s4) var(--s5);
  }
  .note-body .md {
    border: 1px solid var(--line); border-radius: var(--r-sm);
    background: var(--bg); padding: var(--s3) var(--s4);
    max-height: 460px; overflow-y: auto;
  }

  .cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--s5); align-items: start; }
  @media (max-width: 940px) { .cols { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--r); overflow: hidden;
  }
  .card + .card { margin-top: var(--s4); }
  .card-head {
    display: flex; align-items: center; gap: var(--s2);
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft);
  }
  .card-head h2 {
    margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--ink-faint); flex: 1;
  }
  .card-body { padding: var(--s4); }
  .card-body.flush { padding: 0; }

  .kv { display: grid; grid-template-columns: 108px 1fr; gap: var(--s3) var(--s4); align-items: baseline; }
  .kv dt { color: var(--ink-faint); font-size: 12px; }
  .kv dd { margin: 0; }

  .field { width: 100%; padding: 7px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); outline: none; }
  .field:focus { border-color: var(--accent); background: var(--surface); }
  textarea.field { resize: vertical; line-height: 1.55; }

  /* Tasks ---------------------------------------------------------------- */
  .task {
    display: flex; gap: var(--s3); align-items: flex-start;
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft);
    transition: background 100ms ease;
  }
  .task:last-child { border-bottom: 0; }
  .task:hover { background: var(--raised); }
  .check {
    width: 16px; height: 16px; flex: 0 0 16px; margin-top: 2px;
    border-radius: 5px; border: 1.5px solid var(--ink-faint); cursor: default;
    display: grid; place-items: center; font-size: 10px; color: transparent;
    transition: border-color 100ms ease, background 100ms ease;
  }
  .check:hover { border-color: var(--accent); }
  .task.done .check { background: var(--good); border-color: var(--good); color: #fff; }
  .task.done .t-title { text-decoration: line-through; color: var(--ink-faint); }
  .t-body { flex: 1; min-width: 0; }
  .t-title { line-height: 1.45; }
  .t-meta { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: 6px; align-items: center; }

  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500;
    background: var(--raised); color: var(--ink-dim); border: 1px solid transparent;
    white-space: nowrap;
  }
  .chip.high { color: var(--crit); background: transparent; border-color: var(--crit); }
  .chip.doing { color: var(--accent); background: var(--accent-soft); }
  .chip.blocked { color: var(--warn); background: transparent; border-color: var(--warn); }
  .chip.overdue { color: var(--crit); background: transparent; border-color: var(--crit); font-weight: 600; }
  .chip.ref { font-family: var(--mono); font-size: 11px; }
  .t-detail {
    margin-top: var(--s3); color: var(--ink-dim); white-space: pre-wrap;
    font-size: 12.5px; line-height: 1.6; max-height: 200px; overflow: auto;
    border-left: 2px solid var(--line); padding-left: var(--s3);
  }
  .t-actions { display: flex; gap: var(--s1); opacity: 0; transition: opacity 100ms ease; }
  .task:hover .t-actions, .task:focus-within .t-actions { opacity: 1; }

  /* Notes ---------------------------------------------------------------- */
  .note { border: 1px solid var(--line-soft); border-radius: var(--r); background: var(--surface); margin-bottom: var(--s3); }
  .note-head { display: flex; gap: var(--s2); align-items: center; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft); }
  .note-head input { flex: 1; border: 1px solid transparent; background: transparent; font-weight: 600; padding: 4px 6px; border-radius: var(--r-sm); outline: none; }
  .note-head input:hover { border-color: var(--line); }
  .note-head input:focus { border-color: var(--accent); background: var(--bg); }
  .note-body { padding: var(--s3) var(--s4) var(--s4); }
  .kind {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    padding: 3px 8px; border-radius: 4px; background: var(--raised); color: var(--ink-faint);
  }
  .kind.decision { color: var(--accent); background: var(--accent-soft); }
  .kind.gotcha   { color: var(--warn); background: transparent; border: 1px solid var(--warn); }
  .kind.reference{ color: var(--good); background: transparent; border: 1px solid var(--good); }

  /* Project activity ------------------------------------------------------
     The same audit trail as the History tab, narrowed to a project, because a
     delete has to be reversible from where it happened. */
  .restore-bar {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s3) var(--s4); margin-bottom: var(--s3);
    border: 1px solid var(--warn); border-radius: var(--r);
    background: color-mix(in srgb, var(--warn) 10%, var(--surface));
    color: var(--ink);
  }
  .restore-bar span { flex: 1; font-weight: 550; }
  .act {
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 4px; margin-right: 6px;
    background: var(--raised); color: var(--ink-dim);
  }
  .act-create { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .act-delete { background: color-mix(in srgb, var(--crit) 18%, transparent); color: var(--crit); }
  .audit-row.deleted { background: color-mix(in srgb, var(--crit) 5%, transparent); }

  /* Task sheet ------------------------------------------------------------
     Laid out the way task tools people already use lay it out: the facts as a
     row of chips rather than a grid of form fields, detail and history as tabs
     rather than a scroll, and the discussion beside the work with the composer
     pinned where the hands already are. */
  .task-sheet {
    width: min(1160px, 100%); height: min(820px, 100%);
    display: flex; flex-direction: column;
  }
  .ts-top {
    display: flex; align-items: center; gap: var(--s2);
    padding: 10px var(--s4) 10px var(--s5);
    border-bottom: 1px solid var(--line-soft);
  }
  .ts-top .spacer { flex: 1; }
  .ts-crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .crumb {
    background: none; border: 0; padding: 2px 4px; border-radius: 5px;
    color: var(--ink-dim); font-size: 12px; cursor: default;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .crumb:hover { background: var(--raised); color: var(--ink); }
  .crumb-sep { color: var(--ink-faint); font-size: 12px; }
  .crumb-now { color: var(--ink-faint); font-size: 12px; }

  .ts-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px; }
  .ts-main { min-height: 0; overflow-y: auto; padding: var(--s5) var(--s5) var(--s6); }
  .ts-rail {
    min-height: 0; display: flex; flex-direction: column;
    border-left: 1px solid var(--line-soft); background: var(--bg);
  }
  @media (max-width: 940px) {
    .ts-body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 300px; }
    .ts-rail { border-left: 0; border-top: 1px solid var(--line-soft); }
  }

  .ts-title-row { display: flex; align-items: flex-start; gap: var(--s3); margin-bottom: var(--s4); }
  .ts-ring {
    width: 22px; height: 22px; flex: 0 0 22px; margin-top: 3px;
    border-radius: 50%; border: 1.8px solid var(--line);
    background: var(--surface); color: transparent; cursor: default;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .ts-ring:hover { border-color: var(--good); }
  .ts-ring.on { background: var(--good); border-color: var(--good); color: #fff; }
  .ts-ring.sm { width: 17px; height: 17px; flex: 0 0 17px; margin-top: 0; font-size: 10px; }
  .ts-title {
    flex: 1; min-width: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em;
    border: 1px solid transparent; background: transparent; padding: 3px 7px;
    border-radius: var(--r-sm); outline: none; line-height: 1.35;
    resize: none; overflow: hidden; font-family: inherit;
  }
  .ts-title:hover { border-color: var(--line); }
  .ts-title:focus { border-color: var(--accent); background: var(--bg); }

  /* Chips read as facts. They only become controls when clicked. */
  .ts-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: var(--s4); }
  .ts-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface);
    font-size: 12.5px; color: var(--ink); cursor: default;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .ts-chip:hover { border-color: var(--ink-faint); background: var(--raised); }
  .ts-chip.mini { padding: 2px 7px; font-size: 11px; }
  .ts-chip-icon { color: var(--ink-faint); font-size: 12px; }
  .ts-chip-empty { color: var(--ink-faint); }
  .tone-doing   { border-color: var(--accent); color: var(--accent); }
  .tone-blocked { border-color: var(--crit); color: var(--crit); }
  .tone-done    { border-color: var(--good); color: var(--good); }
  .tone-high    { border-color: var(--crit); color: var(--crit); }
  .tone-overdue { border-color: var(--crit); color: var(--crit); }
  .tone-agent   { border-color: var(--accent); color: var(--accent); }
  .tone-ref     { font-family: var(--mono); font-size: 11.5px; }
  .ts-inline {
    border: 1px solid var(--accent); border-radius: 8px; background: var(--bg);
    padding: 4px 8px; font-size: 12.5px; outline: none; color: var(--ink);
  }
  .ts-progress { gap: 8px; }
  .ts-bar { width: 54px; height: 4px; border-radius: 99px; background: var(--raised); overflow: hidden; }
  .ts-bar-fill { display: block; height: 100%; background: var(--good); }

  .ts-desc { margin-bottom: var(--s5); }
  .ts-desc-read {
    border: 1px solid transparent; border-radius: var(--r);
    padding: var(--s3) var(--s4); cursor: text; min-height: 44px;
    font-size: 13.5px; line-height: 1.7;
  }
  .ts-desc-read:hover { border-color: var(--line); }
  .ts-desc-read.ts-desc-blank { color: var(--ink-faint); }
  .ts-desc-read .md :first-child { margin-top: 0; }
  .ts-desc-read .md :last-child { margin-bottom: 0; }
  .ts-desc-edit {
    width: 100%; min-height: 120px; resize: vertical; outline: none;
    border: 1px solid var(--accent); border-radius: var(--r);
    background: var(--bg); padding: var(--s3) var(--s4);
    font-size: 13.5px; line-height: 1.7; color: var(--ink);
  }

  .ts-tabs { display: flex; gap: var(--s4); border-bottom: 1px solid var(--line-soft); margin-bottom: var(--s4); }
  .ts-tab {
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 8px 2px 10px; font-size: 13px; font-weight: 550;
    color: var(--ink-dim); cursor: default;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .ts-tab:hover { color: var(--ink); }
  .ts-tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 620; }
  .ts-tab-n, .ts-count {
    font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 99px;
    background: var(--raised); color: var(--ink-dim);
  }
  .ts-sec-head { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }
  .ts-sec-head h4 {
    font-size: 11px; font-weight: 650; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-faint);
  }

  .ts-sub {
    display: flex; align-items: center; gap: var(--s3);
    padding: 9px 6px; border-bottom: 1px solid var(--line-soft);
  }
  .ts-sub:hover { background: var(--raised); border-radius: var(--r-sm); }
  .ts-sub-title {
    flex: 1; text-align: left; background: none; border: 0; padding: 0;
    font-size: 13.5px; color: var(--ink); cursor: default; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ts-sub-title:hover { color: var(--accent); }
  .ts-sub.done .ts-sub-title { color: var(--ink-faint); text-decoration: line-through; }
  .ts-sub-meta { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .ts-add {
    width: 100%; margin-top: var(--s3); padding: 9px 12px;
    border: 1px dashed var(--line); border-radius: var(--r);
    background: transparent; color: var(--ink); outline: none; font-size: 13px;
  }
  .ts-add:focus { border-style: solid; border-color: var(--accent); background: var(--bg); }

  /* Rail */
  .ts-rail-head {
    display: flex; align-items: center; gap: var(--s2);
    padding: var(--s4) var(--s4) var(--s3); border-bottom: 1px solid var(--line-soft);
  }
  .ts-rail-head h4 { font-size: 12.5px; font-weight: 650; }
  .ts-comments { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
  .ts-comment { font-size: 13px; }
  .ts-comment-who { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .ts-comment-author { font-weight: 620; font-size: 12.5px; }
  .ts-comment .md { font-size: 13px; line-height: 1.65; color: var(--ink-dim); }
  .ts-comment .md :first-child { margin-top: 0; }
  .ts-comment .md :last-child { margin-bottom: 0; }
  .ts-kill {
    margin-left: auto; background: none; border: 0; color: var(--ink-faint);
    font-size: 15px; line-height: 1; cursor: default; opacity: 0; padding: 0 2px;
  }
  .ts-comment:hover .ts-kill { opacity: 1; }
  .ts-kill:hover { color: var(--crit); }
  .avatar {
    width: 20px; height: 20px; border-radius: 99px; flex: 0 0 20px;
    display: grid; place-items: center;
    background: var(--raised); color: var(--ink-dim);
    font-size: 10.5px; font-weight: 700;
  }
  .avatar.sm { width: 17px; height: 17px; flex: 0 0 17px; font-size: 9.5px; }
  .avatar.agent { background: var(--accent); color: #fff; }
  .agent-tag {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 4px; background: var(--accent); color: #fff;
  }
  .ts-composer { border-top: 1px solid var(--line-soft); padding: var(--s3) var(--s4); }
  .ts-composer-box {
    width: 100%; min-height: 62px; resize: vertical; outline: none;
    border: 1px solid var(--line); border-radius: var(--r);
    background: var(--surface); padding: 9px 11px; font-size: 13px; color: var(--ink);
  }
  .ts-composer-box:focus { border-color: var(--accent); }
  .ts-composer-row { display: flex; align-items: center; gap: var(--s2); margin-top: 7px; }
  .ts-composer-row .hint { flex: 1; }

  .timeline { display: flex; flex-direction: column; }
  .tl-row { display: flex; gap: var(--s3); padding-bottom: var(--s3); position: relative; }
  .tl-row:not(:last-child)::before {
    content: ""; position: absolute; left: 4px; top: 14px; bottom: 0;
    width: 1px; background: var(--line);
  }
  .tl-dot { width: 9px; height: 9px; border-radius: 99px; margin-top: 4px; flex: 0 0 9px; background: var(--ink-faint); z-index: 1; }
  .tl-dot.st-doing { background: var(--accent); }
  .tl-dot.st-blocked { background: var(--crit); }
  .tl-dot.st-done { background: var(--good); }
  .tl-status { display: flex; gap: 7px; align-items: baseline; font-size: 13px; font-weight: 600; }
  .tl-when { display: flex; gap: 6px; align-items: center; font-size: 11px; }
  .pad { padding: var(--s2) 0; }
  .t-title[role="button"] { cursor: default; }
  .t-title[role="button"]:hover { color: var(--accent); }

  /* Expanded note ---------------------------------------------------------
     A note that is mostly commands is unreadable in a box six lines tall. This
     is the same note, given the room the content actually needs. */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 78%, black);
    display: grid; place-items: center; padding: var(--s6);
    animation: fade 120ms ease;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); box-shadow: var(--shadow);
    width: min(1100px, 100%); height: min(860px, 100%);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet-head {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line-soft);
  }
  .sheet-head input {
    flex: 1; font-size: 17px; font-weight: 600;
    border: 1px solid transparent; background: transparent;
    padding: 6px 8px; border-radius: var(--r-sm); outline: none; min-width: 0;
  }
  .sheet-head input:hover { border-color: var(--line); }
  .sheet-head input:focus { border-color: var(--accent); background: var(--bg); }
  .sheet-body { flex: 1; padding: var(--s5); min-height: 0; display: flex; }
  .sheet-body textarea {
    flex: 1; resize: none; outline: none;
    border: 1px solid var(--line); border-radius: var(--r);
    background: var(--bg); padding: var(--s4) var(--s5);
    font-size: 14px; line-height: 1.7;
    /* Notes here carry commands and paths as often as prose, and proportional
       type makes indentation and alignment unreadable. */
    font-family: var(--mono);
    tab-size: 2;
  }
  .sheet-body textarea:focus { border-color: var(--accent); }
  .sheet-foot {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s3) var(--s5); border-top: 1px solid var(--line-soft);
    color: var(--ink-faint); font-size: 11.5px;
  }
  .icon-btn {
    flex: 0 0 auto; width: 28px; height: 28px; padding: 0;
    display: grid; place-items: center;
    border-radius: 7px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-dim); cursor: default;
    transition: background 100ms ease, color 100ms ease, border-color 100ms ease;
  }
  .icon-btn:hover { background: var(--raised); color: var(--ink); border-color: var(--ink-faint); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* Lists ---------------------------------------------------------------- */
  .row { display: flex; gap: var(--s2); align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .add-row { display: flex; gap: var(--s2); margin-bottom: var(--s4); }
  .add-row .field { flex: 1; }
  .empty { color: var(--ink-faint); padding: var(--s7) var(--s4); text-align: center; }
  .empty strong { display: block; color: var(--ink-dim); font-weight: 600; margin-bottom: 5px; }
  .hint { color: var(--ink-faint); font-size: 11.5px; }
  .mono { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .list-row { display: flex; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft); }
  .list-row:last-child { border-bottom: 0; }
  .list-row:hover { background: var(--raised); }

  /* A row that acts like a link should look like one before it is hovered, not
     only during. The left edge carries the cue at rest so the whole list reads as
     navigable, and firms up on hover rather than appearing from nothing. */
  .list-row.clickable {
    cursor: default;
    box-shadow: inset 2px 0 0 var(--line);
    transition: box-shadow 100ms ease, background 100ms ease;
  }
  .list-row.clickable:hover,
  .list-row.clickable:focus-visible {
    background: var(--raised);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .list-row.clickable:active { background: var(--raised); }

  /* Settings ------------------------------------------------------------- */
  .setting { padding: var(--s5) 0; border-bottom: 1px solid var(--line-soft); max-width: 70ch; }
  .setting:first-child { padding-top: 0; }
  .setting:last-child { border-bottom: 0; }
  .setting h3 { margin: 0 0 5px; font-size: 15px; font-weight: 600; }
  .setting p { margin: 0 0 var(--s4); color: var(--ink-dim); max-width: 66ch; }
  .recorder {
    display: grid; place-items: center; gap: var(--s2);
    padding: var(--s6); border: 1.5px dashed var(--line); border-radius: var(--r);
    background: var(--surface); cursor: default; -webkit-user-select: none; user-select: none;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .recorder:hover { border-color: var(--ink-faint); }
  .recorder.armed { border-color: var(--accent); background: var(--accent-soft); border-style: solid; }
  .keys { display: flex; gap: var(--s2); align-items: center; }
  .key {
    font-family: var(--mono); font-size: 14px; padding: 7px 13px;
    border-radius: var(--r-sm); background: var(--raised);
    border: 1px solid var(--line); border-bottom-width: 2px;
  }
  .ok-msg { color: var(--good); font-size: 12px; }
  .err-msg { color: var(--crit); font-size: 12px; }

  /* History -------------------------------------------------------------- */
  .audit-row { display: flex; gap: var(--s4); align-items: baseline; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft); }
  .audit-row:last-child { border-bottom: 0; }
  .audit-row:hover { background: var(--raised); }
  .audit-row.undone { opacity: 0.45; }
  .audit-when { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); flex: 0 0 128px; }
  .audit-what { flex: 1; min-width: 0; }
  .audit-what .lbl { color: var(--ink-dim); font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
  <header class="titlebar">
    <div class="search"><input id="search" type="search" placeholder="Ask the Oracle, or search" aria-label="Ask the Oracle" /></div>
    <div class="spacer"></div>
  </header>

  <div class="body">
    <nav class="sidebar">
      <div class="brand">
        <img class="mark" src="assets/mark-64.png" width="26" height="26" alt="" aria-hidden="true" />
        <span class="wordmark">Delphi<span class="sub">Oracle</span></span>
      </div>
      <div class="sidebar-scroll">
        <div class="side-label">Projects</div>
        <div id="projects"></div>
      </div>
      <div class="sidebar-foot">
        <button class="btn wide" id="new-project">New project</button>
      </div>
    </nav>

    <main class="main">
      <div class="head">
        <div class="head-top">
          <button class="back" id="back" title="Back (Command + [)" aria-label="Back" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <div class="grow">
            <h1 id="title">Loading</h1>
            <div class="sub" id="subtitle"></div>
          </div>
          <div class="metrics" id="metrics"></div>
        </div>
        <div class="tabs" id="tabs"></div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
