<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Delphi</title>
<link rel="stylesheet" href="assets/fonts.css" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <header class="titlebar">
    <!-- The name sits with the window chrome now. The mark went to the rail,
         where it is the way back to everything rather than decoration. -->
    <span class="wordmark">Delphi<span class="sub">Oracle</span></span>
    <div class="search"><input id="search" type="search" placeholder="Ask the Oracle, or search" aria-label="Ask the Oracle" /></div>
    <div class="spacer"></div>
    <!-- Who is working and what is waiting, on every view. Painted by
         paintTitleLive() from the same list the Runs page reads. -->
    <button class="tb-live" id="tb-live" type="button" hidden></button>
  </header>

  <div class="body">
    <nav class="sidebar">
      <!-- Places, then projects: Today, Needs you, Runs, All work and Memory,
           then pinned, active and everything else. One column, no rail: a
           folder is something a project has, not a level above it. -->
      <div class="sidebar-scroll">
        <div id="projects"></div>
      </div>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </nav>

    <main class="main">
      <div class="head">
        <div class="head-top">
          <button class="back" id="back" title="Back (Command + [)" aria-label="Back" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18l-6-6 6-6" />
            </svg>
          </button>
          <div class="grow">
            <h1 id="title">Loading</h1>
            <div class="sub" id="subtitle"></div>
          </div>
          <div class="metrics" id="metrics"></div>
        </div>
        <div class="tabs" id="tabs"></div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- Before app.js, which reads window.delphiTime at load. Its own file so
       tools/time_test.js can require the same code under Node. -->
  <script src="timefmt.js"></script>
  <!-- The shared helpers ($, el), before anything that builds DOM. -->
  <script src="ui/core.js"></script>
  <script src="app.js"></script>
</body>
</html>
