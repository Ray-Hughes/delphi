    background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 600;
  }
  .epic-chip-n { font-size: 10.5px; font-weight: 700; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .epic-chip.on .epic-chip-n { color: var(--accent); }

  /* The epic a task belongs to, shown on the row only where the list is not
     already separated into epics: All work, and search results. */
  .t-epic { color: var(--ink-dim); }
  .t-epic::before { content: "▣ "; color: var(--ink-faint); }

  /* The epic chip in the task sheet, alongside status, priority and the rest.
     Named to sit with the other .tone-* rules further up the file. */
  .tone-epic { border-color: var(--ink-faint); }

  /* Reminders -------------------------------------------------------------
     One row shape for both places a reminder is shown, the list and the task
     sheet, so the same thing does not look like two. The time leads, because
     when it fires is the only question a reminder is ever asked. */
  .rem-row {
    display: flex; gap: var(--s3); align-items: flex-start;
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft);
    transition: background 100ms ease;
  }
  .rem-row:last-child { border-bottom: 0; }
  .rem-row:hover { background: var(--raised); }
  /* Dealt with, so still readable and no longer competing for attention. */
  .rem-row.spent { opacity: 0.55; }

  .rem-dot {
    width: 8px; height: 8px; border-radius: 99px; flex: 0 0 8px; margin-top: 6px;
    background: var(--ink-faint);
  }
  .rem-dot.st-pending   { background: var(--accent); }
  .rem-dot.st-snoozed   { background: var(--warn); }
  .rem-dot.st-done      { background: var(--good); }
  .rem-dot.st-dismissed { background: var(--ink-faint); }
  /* Ringing carries a halo rather than an animation: it has to read as urgent
     from the corner of the eye without moving while someone is trying to work. */
  .rem-dot.st-fired {
    background: var(--crit);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--crit) 22%, transparent);
  }

  .rem-when { flex: 0 0 132px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .rem-rel { font-weight: 600; font-size: 12.5px; }
  .rem-row.spent .rem-rel { font-weight: 500; color: var(--ink-dim); }

  .rem-body { flex: 1; min-width: 0; }
  .rem-title { line-height: 1.45; }
  .rem-sub {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin-top: 4px; color: var(--ink-faint); font-size: 11.5px;
  }

  .rem-actions { display: flex; gap: var(--s1); align-items: center; flex: 0 0 auto; opacity: 0; transition: opacity 100ms ease; }
  .rem-row:hover .rem-actions, .rem-row:focus-within .rem-actions { opacity: 1; }
  /* The delete cross is shared with comments, where it hides until the row is
     hovered. The row above already does that, so it stays visible inside it. */
  .rem-row .ts-kill { opacity: 1; }

  /* Setting one. The time field and the shortcuts sit together rather than one
     replacing the other, so "tomorrow morning" is a click and half past four on
     Thursday is still reachable without leaving the row. */
  .rem-set {
    margin-top: var(--s4); padding: var(--s3);
    border: 1px dashed var(--line); border-radius: var(--r);
    display: flex; flex-direction: column; gap: var(--s2);
  }
  .rem-set .field { width: auto; }
  .rem-set .row > input[type="datetime-local"] { flex: 0 0 auto; }
  .rem-set .row > input[type="text"], .rem-set .row > input:not([type]) { flex: 1; min-width: 0; }
  .rem-set select.field { flex: 0 0 auto; }

  /* The queue ---------------------------------------------------------------
     Sections rather than columns: the three states are a sequence, not
     alternatives, and reading them top to bottom is reading what happens to a
     piece of work. */
  .q-sec { margin-bottom: var(--s4); padding: 0; }
  .q-head {
    display: flex; align-items: center; gap: var(--s2);
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft);
  }
  .q-title { font-weight: 650; font-size: 13px; letter-spacing: .02em; }
  .q-n {
    font-size: 11px; color: var(--ink-faint); background: var(--raised);
    border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums;
  }
  .q-note { text-align: right; font-size: 11px; }
  .q-row {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft);
  }
  .q-row:last-child { border-bottom: 0; }
  .q-row:hover { background: var(--raised); }
  .q-name {
    flex: 1; text-align: left; background: none; border: 0; padding: 0;
    color: var(--ink); font: inherit; cursor: pointer; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .q-name:hover { color: var(--accent); }
  .q-meta { display: flex; align-items: center; gap: var(--s2); flex: 0 0 auto; }
  /* Quick look: read the task without opening it */
  .qlook {
    width: min(520px, 100%); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--shadow); padding: var(--s5);
    display: flex; flex-direction: column; gap: var(--s4);
    max-height: min(640px, 100%); overflow-y: auto;
  }
  .qlook-head { display: flex; align-items: flex-start; gap: var(--s3); }
  .qlook-head h3 { font-size: 16px; font-weight: 650; line-height: 1.4; }
  .dot-status { width: 9px; height: 9px; border-radius: 99px; flex: 0 0 9px; margin-top: 6px; background: var(--ink-faint); }
  .dot-status.st-doing { background: var(--accent); }
  .dot-status.st-blocked { background: var(--crit); }
  .dot-status.st-done { background: var(--good); }
  .qlook-grid {
    display: grid; grid-template-columns: 110px minmax(0, 1fr);
    gap: 7px var(--s4); font-size: 13px;
  }
  .qlook-label { color: var(--ink-faint); }
  .qlook-value { color: var(--ink); }
  .qlook-detail {
    border-top: 1px solid var(--line-soft); padding-top: var(--s3);
    font-size: 13px; line-height: 1.65; color: var(--ink-dim);
    max-height: 200px; overflow-y: auto;
  }
  .qlook-detail :first-child { margin-top: 0; }
  .qlook-foot { display: flex; align-items: center; gap: var(--s2); }
  .qlook-foot .hint { flex: 1; }

  /* Task sheet ------------------------------------------------------------
     Laid out the way task tools people already use lay it out: the facts as a
     row of chips rather than a grid of form fields, detail and history as tabs
     rather than a scroll, and the discussion beside the work with the composer
     pinned where the hands already are. */
  .task-sheet {
    width: min(1160px, 100%); height: min(820px, 100%);
    display: flex; flex-direction: column;
  }
  .ts-top {
    display: flex; align-items: center; gap: var(--s2);
    padding: 10px var(--s4) 10px var(--s5);
    border-bottom: 1px solid var(--line-soft);
  }
  .ts-top .spacer { flex: 1; }
  .ts-crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .crumb {
    background: none; border: 0; padding: 2px 4px; border-radius: 5px;
    color: var(--ink-dim); font-size: 12px; cursor: default;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .crumb:hover { background: var(--raised); color: var(--ink); }
  .crumb-sep { color: var(--ink-faint); font-size: 12px; }
  .crumb-now { color: var(--ink-faint); font-size: 12px; }

  .ts-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 330px; }
  .ts-main { min-height: 0; overflow-y: auto; padding: var(--s5) var(--s5) var(--s6); }
  .ts-rail {
    min-height: 0; display: flex; flex-direction: column;
    border-left: 1px solid var(--line-soft); background: var(--bg);
  }
  @media (max-width: 940px) {
    .ts-body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 300px; }
    .ts-rail { border-left: 0; border-top: 1px solid var(--line-soft); }
  }

  .ts-title-row { display: flex; align-items: flex-start; gap: var(--s3); margin-bottom: var(--s4); }
  .ts-ring {
    width: 22px; height: 22px; flex: 0 0 22px; margin-top: 3px;
    border-radius: 50%; border: 1.8px solid var(--line);
    background: var(--surface); color: transparent; cursor: default;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .ts-ring:hover { border-color: var(--good); }
  .ts-ring.on { background: var(--good); border-color: var(--good); color: #fff; }
  .ts-ring.sm { width: 17px; height: 17px; flex: 0 0 17px; margin-top: 0; font-size: 10px; }
  .ts-title {
    flex: 1; min-width: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em;
    border: 1px solid transparent; background: transparent; padding: 3px 7px;
    border-radius: var(--r-sm); outline: none; line-height: 1.35;
    resize: none; overflow: hidden; font-family: inherit;
  }
  .ts-title:hover { border-color: var(--line); }
  .ts-title:focus { border-color: var(--accent); background: var(--bg); }

  /* Chips read as facts. They only become controls when clicked. */
  .ts-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: var(--s4); }
  .ts-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface);
    font-size: 12.5px; color: var(--ink); cursor: default;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .ts-chip:hover { border-color: var(--ink-faint); background: var(--raised); }
  .ts-chip.mini { padding: 2px 7px; font-size: 11px; }
  .ts-chip-icon { color: var(--ink-faint); font-size: 12px; }
  .ts-chip-empty { color: var(--ink-faint); }
  .tone-doing   { border-color: var(--accent); color: var(--accent); }
  .tone-blocked { border-color: var(--crit); color: var(--crit); }
  .tone-done    { border-color: var(--good); color: var(--good); }
  .tone-high    { border-color: var(--crit); color: var(--crit); }
  .tone-overdue { border-color: var(--crit); color: var(--crit); }
  .tone-agent   { border-color: var(--accent); color: var(--accent); }
  .tone-ref     { font-family: var(--mono); font-size: 11.5px; }
  .ts-inline {
    border: 1px solid var(--accent); border-radius: 8px; background: var(--bg);
    padding: 4px 8px; font-size: 12.5px; outline: none; color: var(--ink);
  }
  .ts-progress { gap: 8px; }
  .ts-bar { width: 54px; height: 4px; border-radius: 99px; background: var(--raised); overflow: hidden; }
  .ts-bar-fill { display: block; height: 100%; background: var(--good); }

  .ts-desc { margin-bottom: var(--s5); }
  .ts-desc-read {
    border: 1px solid transparent; border-radius: var(--r);
    padding: var(--s3) var(--s4); cursor: text; min-height: 44px;
    font-size: 13.5px; line-height: 1.7;
  }
  .ts-desc-read:hover { border-color: var(--line); }
  .ts-desc-read.ts-desc-blank { color: var(--ink-faint); }
  .ts-desc-read .md :first-child { margin-top: 0; }
  .ts-desc-read .md :last-child { margin-bottom: 0; }
  .ts-desc-edit {
    width: 100%; min-height: 120px; resize: vertical; outline: none;
    border: 1px solid var(--accent); border-radius: var(--r);
    background: var(--bg); padding: var(--s3) var(--s4);
    font-size: 13.5px; line-height: 1.7; color: var(--ink);
  }

  .ts-tabs { display: flex; gap: var(--s4); border-bottom: 1px solid var(--line-soft); margin-bottom: var(--s4); }
  .ts-tab {
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 8px 2px 10px; font-size: 13px; font-weight: 550;
    color: var(--ink-dim); cursor: default;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .ts-tab:hover { color: var(--ink); }
  .ts-tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 620; }
  .ts-tab-n, .ts-count {
    font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 99px;
    background: var(--raised); color: var(--ink-dim);
  }
  .ts-sec-head { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s2); }
  .ts-sec-head h4 {
    font-size: 11px; font-weight: 650; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--ink-faint);
  }

  .ts-sub {
    display: flex; align-items: center; gap: var(--s3);
    padding: 9px 6px; border-bottom: 1px solid var(--line-soft);
  }
  .ts-sub:hover { background: var(--raised); border-radius: var(--r-sm); }
  .ts-sub-title {
    flex: 1; text-align: left; background: none; border: 0; padding: 0;
    font-size: 13.5px; color: var(--ink); cursor: default; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ts-sub-title:hover { color: var(--accent); }
  .ts-sub.done .ts-sub-title { color: var(--ink-faint); text-decoration: line-through; }
  .ts-sub-meta { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .ts-add {
    width: 100%; margin-top: var(--s3); padding: 9px 12px;
    border: 1px dashed var(--line); border-radius: var(--r);
    background: transparent; color: var(--ink); outline: none; font-size: 13px;
  }
  .ts-add:focus { border-style: solid; border-color: var(--accent); background: var(--bg); }

  /* Rail */
  .ts-rail-head {
    display: flex; align-items: center; gap: var(--s2);
    padding: var(--s4) var(--s4) var(--s3); border-bottom: 1px solid var(--line-soft);
  }
  .ts-rail-head h4 { font-size: 12.5px; font-weight: 650; }
  .ts-comments { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s3) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
  .ts-comment { font-size: 13px; }
  .ts-comment-who { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .ts-comment-author { font-weight: 620; font-size: 12.5px; }
  .ts-comment .md { font-size: 13px; line-height: 1.65; color: var(--ink-dim); }
  .ts-comment .md :first-child { margin-top: 0; }
  .ts-comment .md :last-child { margin-bottom: 0; }
  .ts-kill {
    margin-left: auto; background: none; border: 0; color: var(--ink-faint);
    font-size: 15px; line-height: 1; cursor: default; opacity: 0; padding: 0 2px;
  }
  .ts-comment:hover .ts-kill { opacity: 1; }
  .ts-kill:hover { color: var(--crit); }
  .avatar {
    width: 20px; height: 20px; border-radius: 99px; flex: 0 0 20px;
    display: grid; place-items: center;
    background: var(--raised); color: var(--ink-dim);
    font-size: 10.5px; font-weight: 700;
  }
  .avatar.sm { width: 17px; height: 17px; flex: 0 0 17px; font-size: 9.5px; }
  .avatar.agent { background: var(--accent); color: #fff; }
  .agent-tag {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 4px; background: var(--accent); color: #fff;
  }
  .ts-composer { border-top: 1px solid var(--line-soft); padding: var(--s3) var(--s4); }
  .ts-composer-box {
    width: 100%; min-height: 62px; resize: vertical; outline: none;
    border: 1px solid var(--line); border-radius: var(--r);
    background: var(--surface); padding: 9px 11px; font-size: 13px; color: var(--ink);
  }
  .ts-composer-box:focus { border-color: var(--accent); }
  .ts-composer-row { display: flex; align-items: center; gap: var(--s2); margin-top: 7px; }
  .ts-composer-row .hint { flex: 1; }

  .timeline { display: flex; flex-direction: column; }
  .tl-row { display: flex; gap: var(--s3); padding-bottom: var(--s3); position: relative; }
  .tl-row:not(:last-child)::before {
    content: ""; position: absolute; left: 4px; top: 14px; bottom: 0;
    width: 1px; background: var(--line);
  }
  .tl-dot { width: 9px; height: 9px; border-radius: 99px; margin-top: 4px; flex: 0 0 9px; background: var(--ink-faint); z-index: 1; }
  .tl-dot.st-doing { background: var(--accent); }
  .tl-dot.st-blocked { background: var(--crit); }
  .tl-dot.st-done { background: var(--good); }
  .tl-status { display: flex; gap: 7px; align-items: baseline; font-size: 13px; font-weight: 600; }
  .tl-when { display: flex; gap: 6px; align-items: center; font-size: 11px; }
  .pad { padding: var(--s2) var(--s4); }
  .t-title[role="button"] { cursor: default; }
  .t-title[role="button"]:hover { color: var(--accent); }

  /* Expanded note ---------------------------------------------------------
     A note that is mostly commands is unreadable in a box six lines tall. This
     is the same note, given the room the content actually needs. */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: color-mix(in srgb, var(--bg) 78%, black);
    display: grid; place-items: center; padding: var(--s6);
    animation: fade 120ms ease;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* Asking for one line ----------------------------------------------------
     Stands in for window.prompt, which Electron does not implement. Sized to the
     question rather than to the window, so it reads as a question and not as
     another full sheet. */
  .ask {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); box-shadow: var(--shadow);
    width: min(440px, 100%); padding: var(--s5);
    display: flex; flex-direction: column; gap: var(--s3);
  }
  .ask h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .ask p { margin: 0; }
  .ask .field { width: 100%; }
  .ask-actions { display: flex; justify-content: flex-end; gap: var(--s2); margin-top: var(--s2); }

  /* Agreeing to a delete --------------------------------------------------
     The .ask shell, with room for the one decision a project delete forces.
     Each option carries the sentence that says what it costs, because the
     difference between them is not visible in their labels. */
  .destroy-choices { display: flex; flex-direction: column; gap: var(--s2); }
  .destroy-choice {
    display: flex; gap: var(--s3); align-items: flex-start;
    padding: var(--s3); border: 1px solid var(--line); border-radius: var(--r-sm);
    background: var(--bg); cursor: default;
  }
  .destroy-choice:hover { border-color: var(--ink-faint); }
  .destroy-choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .destroy-choice > span { display: flex; flex-direction: column; gap: 3px; }
  .destroy-choice-label { font-weight: 600; }

  .sheet {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); box-shadow: var(--shadow);
    width: min(1100px, 100%); height: min(860px, 100%);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet-head {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s4) var(--s5); border-bottom: 1px solid var(--line-soft);
  }
  .sheet-head input {
    flex: 1; font-size: 17px; font-weight: 600;
    border: 1px solid transparent; background: transparent;
    padding: 6px 8px; border-radius: var(--r-sm); outline: none; min-width: 0;
  }
  .sheet-head input:hover { border-color: var(--line); }
  .sheet-head input:focus { border-color: var(--accent); background: var(--bg); }
  .sheet-body { flex: 1; padding: var(--s5); min-height: 0; display: flex; }
  .sheet-body textarea {
    flex: 1; resize: none; outline: none;
    border: 1px solid var(--line); border-radius: var(--r);
    background: var(--bg); padding: var(--s4) var(--s5);
    font-size: 14px; line-height: 1.7;
    /* Notes here carry commands and paths as often as prose, and proportional
       type makes indentation and alignment unreadable. */
    font-family: var(--mono);
    tab-size: 2;
  }
  .sheet-body textarea:focus { border-color: var(--accent); }
  .sheet-foot {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s3) var(--s5); border-top: 1px solid var(--line-soft);
    color: var(--ink-faint); font-size: 11.5px;
  }
  .icon-btn {
    flex: 0 0 auto; width: 28px; height: 28px; padding: 0;
    display: grid; place-items: center;
    border-radius: 7px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-dim); cursor: default;
    transition: background 100ms ease, color 100ms ease, border-color 100ms ease;
  }
  .icon-btn:hover { background: var(--raised); color: var(--ink); border-color: var(--ink-faint); }
  .icon-btn svg { width: 14px; height: 14px; }

  /* Lists ---------------------------------------------------------------- */
  .row { display: flex; gap: var(--s2); align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .add-row { display: flex; gap: var(--s2); margin-bottom: var(--s4); }
  .add-row .field { flex: 1; }
  .empty { color: var(--ink-faint); padding: var(--s7) var(--s4); text-align: center; }
  .empty strong { display: block; color: var(--ink-dim); font-weight: 600; margin-bottom: 5px; }
  .hint { color: var(--ink-faint); font-size: 11.5px; }
  .mono { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .list-row { display: flex; gap: var(--s3); align-items: center; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft); }
  .list-row:last-child { border-bottom: 0; }
  .list-row:hover { background: var(--raised); }

  /* A row that acts like a link should look like one before it is hovered, not
     only during. The left edge carries the cue at rest so the whole list reads as
     navigable, and firms up on hover rather than appearing from nothing. */
  .list-row.clickable {
    cursor: default;
    box-shadow: inset 2px 0 0 var(--line);
    transition: box-shadow 100ms ease, background 100ms ease;
  }
  .list-row.clickable:hover,
  .list-row.clickable:focus-visible {
    background: var(--raised);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .list-row.clickable:active { background: var(--raised); }

  /* A run of .list-row draws its own separators and nothing else, which is right
     inside a card body and adrift anywhere there is no card. This is the border
     the card would otherwise have supplied. */
  .list-box { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }

  /* Settings ------------------------------------------------------------- */
  .setting { padding: var(--s5) 0; border-bottom: 1px solid var(--line-soft); max-width: 70ch; }
  .setting:first-child { padding-top: 0; }
  .setting:last-child { border-bottom: 0; }
  .setting h3 { margin: 0 0 5px; font-size: 15px; font-weight: 600; }
  .setting p { margin: 0 0 var(--s4); color: var(--ink-dim); max-width: 66ch; }
  /* .field is full width, which is right for the text ones and wrong for a
     dropdown: a five word choice stretched across 70ch reads as a mistake. */
  .setting .row > select.field { width: auto; flex: 0 0 auto; }
  .setting .row > .btn { flex: 0 0 auto; }
  .recorder {
    display: grid; place-items: center; gap: var(--s2);
    padding: var(--s6); border: 1.5px dashed var(--line); border-radius: var(--r);
    background: var(--surface); cursor: default; -webkit-user-select: none; user-select: none;
    transition: border-color 120ms ease, background 120ms ease;
  }
  .recorder:hover { border-color: var(--ink-faint); }
  .recorder.armed { border-color: var(--accent); background: var(--accent-soft); border-style: solid; }
  .keys { display: flex; gap: var(--s2); align-items: center; }
  .key {
    font-family: var(--mono); font-size: 14px; padding: 7px 13px;
    border-radius: var(--r-sm); background: var(--raised);
    border: 1px solid var(--line); border-bottom-width: 2px;
  }
  .ok-msg { color: var(--good); font-size: 12px; }
  .err-msg { color: var(--crit); font-size: 12px; }

  /* History -------------------------------------------------------------- */
  .audit-row { display: flex; gap: var(--s4); align-items: baseline; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft); }
  .audit-row:last-child { border-bottom: 0; }
  .audit-row:hover { background: var(--raised); }
  .audit-row.undone { opacity: 0.45; }
  .audit-when { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); flex: 0 0 128px; }
  .audit-what { flex: 1; min-width: 0; }
  .audit-what .lbl { color: var(--ink-dim); font-size: 12px; margin-top: 2px; }

  /* ======================================================================
     Granular
     ----------------------------------------------------------------------
     The project rail, the session sidebar and the chat, built to Granular's
     own measurements rather than to something that merely resembles them.

     Granular's app chrome is dark whatever the page around it is doing, and
     these --c-* names are that console palette. They are still redefined for
     light so the rest of this window does not end up with a dark slab bolted
     to the side of it, but dark is the real one: it is what the design was
     drawn against, and the accent was picked to sit on #151618.
     ====================================================================== */
  :root {
    --c-bg:      #151618;
    --c-surf:    #232426;
    --c-edge:    #232426;   /* same value as the surface, used as every panel border */
    --c-edge2:   #3a3a3d;
    --c-ink:     #fafafb;
    --c-mut:     #acaeb1;
    --c-faint:   #7f8083;
    --c-acc:     #ff5800;
    --c-acc-ink: #ff8a4d;
    --c-ok:      #96e3a6;
  }
  :root[data-theme="light"], :root:not([data-theme="dark"]) {
    --c-bg:      #ffffff;
    --c-surf:    #fafafa;
    --c-edge:    #e8e8e9;
    --c-edge2:   #d9d9db;
    --c-ink:     #1b1c1e;
    --c-mut:     #5d5e61;
    --c-faint:   #8a8b8e;
    --c-acc:     #ff5800;
    --c-acc-ink: #c84400;
    --c-ok:      #1d8a4e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --c-bg:      #151618;
      --c-surf:    #232426;
      --c-edge:    #232426;
      --c-edge2:   #3a3a3d;
      --c-ink:     #fafafb;
      --c-mut:     #acaeb1;
      --c-faint:   #7f8083;
      --c-acc:     #ff5800;
      --c-acc-ink: #ff8a4d;
      --c-ok:      #96e3a6;
    }
  }
  :root[data-theme="dark"] {
    --c-bg:      #151618;
    --c-surf:    #232426;
    --c-edge:    #232426;
    --c-edge2:   #3a3a3d;
    --c-ink:     #fafafb;
    --c-mut:     #acaeb1;
    --c-faint:   #7f8083;
    --c-acc:     #ff5800;
    --c-acc-ink: #ff8a4d;
    --c-ok:      #96e3a6;
  }

  /* Project rail ---------------------------------------------------------
     Not .rail: .ts-rail already exists on the task sheet and the two would
     read as a family they are not part of. */
  .project-rail {
    width: 48px; flex: 0 0 48px;
    display: flex; flex-direction: column; align-items: stretch; gap: 8px;
    padding: 12px 6px;
    background: var(--surface);
    border-right: 1px solid var(--line-soft);
    /* The titlebar is a drag region and this sits under it. Without this a
       click on a project tile moves the window instead of opening it. */
    -webkit-app-region: no-drag;
    overflow-y: auto; overflow-x: hidden;
  }
  .rail-tile {
    position: relative; aspect-ratio: 1; width: 36px;
    border-radius: 9px; border: 1px solid var(--c-edge2);
    background: var(--c-surf);
    display: grid; place-items: center;
    font-family: var(--display);
    font-size: 13px; font-weight: 600; color: var(--c-mut);
    overflow: hidden; cursor: default;
    -webkit-user-select: none; user-select: none;
    transition: border-color 100ms ease, transform 100ms ease, color 100ms ease;
  }
  .rail-tile:hover { color: var(--c-ink); border-color: var(--c-faint); }
  .rail-tile.on {
    border-color: var(--c-acc); color: var(--c-ink);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 8px 24px rgba(0,0,0,.35);
  }
  /* Same 36px square as a project tile, so the column keeps one rhythm, but
     dashed and empty so it reads as the slot a project has yet to fill. */
  .rail-add {
    border-style: dashed; border-color: var(--c-edge2);
    background: transparent; color: var(--c-faint);
    cursor: pointer;
  }
  .rail-add:hover, .rail-add:focus-visible {
    border-style: solid; border-color: var(--c-acc); color: var(--c-acc);
    background: color-mix(in srgb, var(--c-acc) 10%, transparent);
  }
  .rail-add:active { transform: scale(.94); }
  @media (prefers-reduced-motion: reduce) { .rail-add:active { transform: none; } }
  :root[data-motion="off"] .rail-add:active { transform: none; }
  .rail-sp { flex: 1 1 auto; }
  .rail-div { height: 1px; width: 24px; margin: 0 auto; background: var(--line); flex: 0 0 auto; }
  /* A tile whose folder has gone. Stated rather than silently working, because
     a project that cannot find its own files will fail later and less clearly. */
  .rail-tile.lost { border-style: dashed; border-color: var(--crit); color: var(--crit); }

  /* Chat -----------------------------------------------------------------
     Granular's measurements, kept as authored. The one deliberate departure
     is that the composer is a real textarea rather than the marketing page's
     static placeholder, so it grows with what is typed. */
  .chat { display: flex; flex-direction: column; min-width: 0; height: 100%; }

  .gstream {
    flex: 1; min-height: 0; overflow: auto;
    display: flex; flex-direction: column; justify-content: flex-start;
    gap: 11px; padding: 12px 16px;
  }
  .gmsg { font-size: 12.5px; line-height: 1.55; max-width: 86%; }
  /* Only the person gets a bubble. The agent is set as running text, which is
     what makes a long reply readable instead of a wall inside a box. */
  .gmsg.you {
    align-self: flex-end;
    background: var(--c-surf); border: 1px solid var(--c-edge2);
    border-radius: 11px 11px 4px 11px; padding: 9px 13px; color: var(--c-ink);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .gmsg.ai { align-self: stretch; max-width: 100%; color: var(--c-mut); }
  .gmsg.ai b, .gmsg.ai strong { color: var(--c-ink); font-weight: 600; }
  .gmsg.ai p { margin: 0 0 8px; }
  .gmsg.ai > :last-child { margin-bottom: 0; }
  .gmsg ul, .gmsg ol { margin: 4px 0 0; padding-left: 17px; }
  .gmsg li { margin: 2px 0; }
  .gmsg.ai pre {
    background: var(--c-surf); border: 1px solid var(--c-edge2);
    border-radius: 8px; padding: 8px 10px; overflow-x: auto; margin: 6px 0;
  }
  .gmsg.ai code { font-family: var(--mono); font-size: 11px; }
  .gmsg.err { align-self: stretch; max-width: 100%; color: var(--crit); font-size: 11.5px; }

  /* Empty state */
  .gempty {
    margin: auto; display: flex; flex-direction: column; align-items: center;
    gap: 7px; text-align: center; padding: 8px 4px;
  }
  .gempty .ge-k {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; color: var(--c-faint);
    text-transform: uppercase;
  }
  .gempty .ge-t { font-size: 11px; line-height: 1.5; color: var(--c-mut); max-width: 230px; }
  .gempty .ge-cards {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    width: 100%; max-width: 264px; margin-top: 5px;
  }
  .gempty .ge-card {
    border: 1px solid var(--c-edge2); background: var(--c-surf);
    border-radius: 8px; padding: 7px 9px; text-align: left; cursor: default;
    transition: border-color 100ms ease;
  }
  .gempty .ge-card:hover { border-color: var(--c-acc); }
  .gempty .ge-card b { display: block; font-size: 10.5px; font-weight: 600; color: var(--c-ink); }
  .gempty .ge-card span { display: block; margin-top: 2px; font-size: 9px; line-height: 1.35; color: var(--c-faint); }
  .gempty .ge-conn { margin-top: 4px; font-size: 9px; color: var(--c-faint); }

  /* Composer */
  .gcomp {
    margin: 10px 12px 0; display: flex; align-items: flex-end; gap: 8px;
    border: 1px solid var(--c-edge2); border-radius: 8px; background: var(--c-surf);
    padding: 8px 12px; min-height: 34px; flex: 0 0 auto;
    transition: border-color 120ms ease;
  }
  .gcomp:focus-within { border-color: var(--c-acc); }
  .gcomp textarea {
    flex: 1; border: 0; background: transparent; outline: none; resize: none;
    color: var(--c-ink); font-family: var(--font); font-size: 12px; line-height: 1.4;
    max-height: 160px; padding: 0;
  }
  .gcomp textarea::placeholder { color: var(--c-faint); }

  /* Model and permission row */
  .gmodel {
    position: relative; display: flex; align-items: center; flex-wrap: wrap;
    gap: 4px; padding: 9px 11px 3px;
  }
  .gconn {
    display: flex; align-items: center; gap: 5px;
    border: 1px solid transparent; border-radius: 6px; padding: 3px 6px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .02em;
    color: var(--c-mut); cursor: default;
  }
  .gconn:hover, .gconn.open { border-color: var(--c-edge2); background: var(--c-surf); color: var(--c-ink); }
  .gconn .mk {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 4px;
    border: 1px solid rgba(0,0,0,.12); background: #fff; flex: 0 0 auto;
    font-size: 9px; font-weight: 700; color: #d97757; font-family: var(--font);
  }
  .gconn .cv { font-size: 7px; color: var(--c-faint); opacity: .8; margin-left: 1px; }
  .gpill {
    display: flex; align-items: center; gap: 4px;
    border: 1px solid transparent; border-radius: 6px; padding: 3px 6px;
    font-size: 9.5px; color: var(--c-faint); cursor: default;
  }
  .gpill.bd { border-color: var(--c-edge); color: var(--c-mut); }
  .gpill:hover { border-color: var(--c-edge2); color: var(--c-mut); }
  .gpill .mono2 { font-family: var(--mono); }
  .gpill .cv { font-size: 7px; color: var(--c-faint); }

  /* Token meter */
  .gmeter {
    display: flex; align-items: center; gap: 8px; padding: 3px 12px 11px;
    font-family: var(--mono); font-size: 9.5px; color: var(--c-faint);
  }
  .gmeter .ml { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .gmeter .bar {
    position: relative; width: 28px; height: 4px; border-radius: 99px;
    background: var(--c-edge2); overflow: hidden;
  }
  .gmeter .bar span { position: absolute; inset: 0; left: 0; background: rgba(255,88,0,.7); }

  /* Session list in the sidebar */
  .gs {
    display: flex; align-items: center; gap: 7px;
    border: 1px solid transparent; border-radius: 8px; padding: 7px 9px;
    font-size: 12.5px; color: var(--c-mut); white-space: nowrap; cursor: default;
  }
  .gs:hover { color: var(--c-ink); }
  .gs.on {
    border-color: var(--c-edge2); background: var(--c-surf); color: var(--c-ink);
    box-shadow: 0 1px 0 0 rgba(255,255,255,.05), 0 8px 22px rgba(0,0,0,.28);
  }
  .gs .sd { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--c-edge2); }
  .gs .sd.live {
    width: 9px; height: 9px; background: transparent;
    border: 1.5px solid rgba(255,88,0,.28); border-top-color: var(--c-acc);
    animation: gspin .7s linear infinite;
  }
  @keyframes gspin { to { transform: rotate(360deg); } }
  .gs .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .gs .kbd { font-family: var(--mono); font-size: 10px; color: var(--c-faint); }
  .gnew {
    display: flex; align-items: center; gap: 8px; margin: 0 0 6px;
    border: 1px solid var(--c-edge); border-radius: 8px; padding: 7px 10px;
    color: var(--c-mut); font-size: 11.5px; cursor: default;
  }
  .gnew:hover { border-color: var(--c-acc); color: var(--c-ink); }

  @media (prefers-reduced-motion: reduce) {
    .gs .sd.live { animation: none; background: var(--c-acc); border-color: transparent; }
  }
  :root[data-motion="off"] .gs .sd.live { animation: none; background: var(--c-acc); border-color: transparent; }


  /* Project panel, in the sidebar ---------------------------------------- */
  .pp-head { display: flex; align-items: flex-start; gap: 8px; padding: 4px 4px 10px; }
  .pp-head .nm { min-width: 0; flex: 1; }
  .pp-head .t {
    display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .2em;
    color: var(--ink-dim); text-transform: uppercase;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* The folder, shown under the name. A project is a place now, and this is the
     only spot that says which one without opening settings. */
  .pp-head .p {
    display: block; font-family: var(--mono); font-size: 9px; color: var(--ink-faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px;
    direction: rtl; text-align: left;   /* keeps the last segment visible when it clips */
  }
  .pp-head .p.none { color: var(--warn); direction: ltr; }
  .pp-sec {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em;
    color: var(--ink-faint); padding: 10px 4px 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .pp-sec .n { color: var(--ink-faint); font-weight: 400; font-family: var(--mono); }
  .pp-empty { color: var(--ink-faint); font-size: 11px; padding: 2px 4px 6px; line-height: 1.45; }

  /* The wordmark in the title bar, left of the search. */
  .titlebar .wordmark {
    flex: 0 0 auto; -webkit-app-region: drag;
    display: flex; align-items: baseline; gap: 6px;
    font-family: var(--display); font-size: 14px; font-weight: 650; letter-spacing: -0.01em;
    margin-right: var(--s2);
  }
  .titlebar .wordmark .sub {
    font-size: 9px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  @media (max-width: 780px) { .titlebar .wordmark .sub { display: none; } }

  /* The mark at the top of the rail. Same footprint as a project tile so the
     column reads as one stack rather than a logo with a list under it. */
  .rail-mark {
    width: 36px; aspect-ratio: 1; border-radius: 9px; padding: 0;
    display: grid; place-items: center; flex: 0 0 auto;
    border: 1px solid transparent; background: transparent; cursor: default;
    -webkit-app-region: no-drag;
    transition: border-color 100ms ease, transform 100ms ease;
  }
  .rail-mark img { width: 26px; height: 26px; display: block; border-radius: 7px; }
  .rail-mark:hover { transform: translateY(-1px); }
  .rail-mark.on { border-color: var(--c-acc); box-shadow: 0 8px 24px rgba(0,0,0,.35); }

  /* Workspace picker rows in the sidebar. */
  .ws-row {
    display: flex; align-items: center; gap: var(--s3);
    padding: 8px 9px; border-radius: var(--r-sm);
    border: 1px solid transparent; cursor: default;
    transition: background 100ms ease, border-color 100ms ease;
  }
  .ws-row:hover, .ws-row:focus-visible { background: var(--raised); border-color: var(--line); }
  .ws-ico {
    width: 26px; height: 26px; flex: 0 0 26px; border-radius: 7px;
    display: grid; place-items: center;
    border: 1px solid var(--c-edge2); background: var(--c-surf);
    font-family: var(--display); font-size: 12px; font-weight: 600; color: var(--ink-dim);
  }
  .ws-txt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
  .ws-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-p {
    font-family: var(--mono); font-size: 9px; color: var(--ink-faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    direction: rtl; text-align: left;
  }

  /* Sessions, indented under the project they belong to. The rule on the left is
     what makes the column read as one tree rather than two stacked lists. */
  .gkids {
    margin: 2px 0 4px 13px; padding-left: 10px;
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 2px;
  }
  .gs.sub { font-size: 12px; padding: 5px 8px; }
  .gs .nm.dim { color: var(--ink-faint); }
  .gs .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; }

  .row.wrap { flex-wrap: wrap; gap: var(--s2); align-items: center; }
  .ws-chip { display: inline-flex; align-items: center; gap: 6px; cursor: default; }
  .ws-chip.primary { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .ws-chip .hint { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; }
  .chip-x {
    border: 0; background: transparent; color: inherit; opacity: .55;
    padding: 0 0 0 2px; font-size: 13px; line-height: 1; cursor: default;
  }
  .chip-x:hover { opacity: 1; color: var(--crit); }

  /* Icon picker, in the workspace settings. */
  .icon-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: var(--s2); max-width: 420px;
  }
  .icon-opt {
    aspect-ratio: 1; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: var(--r-sm);
    background: var(--surface); color: var(--ink-dim);
    font-size: 17px; font-family: var(--display); cursor: default;
    transition: border-color 100ms ease, background 100ms ease, transform 100ms ease;
  }
  .icon-opt:hover { border-color: var(--ink-faint); color: var(--ink); }
  .icon-opt.on {
    border-color: var(--accent); color: var(--accent);
    background: var(--accent-soft); font-weight: 600;
  }
  .icon-opt:active { transform: scale(.94); }
  @media (prefers-reduced-motion: reduce) { .icon-opt:active { transform: none; } }
  :root[data-motion="off"] .icon-opt:active { transform: none; }

  /* A rail tile is one letter or one glyph, which is not enough to tell two
     workspaces apart at a glance. The name appears beside it on hover, rather
     than through the native tooltip, which takes a second to arrive and is far
     too slow for something you are scanning. */
  .project-rail { overflow: visible; }
  .rail-tile[data-name] { position: relative; }
  .rail-tile[data-name]::after {
    content: attr(data-name);
    position: absolute; left: calc(100% + 8px); top: 50%;
    transform: translateY(-50%) translateX(-4px);
    padding: 5px 9px; border-radius: var(--r-sm);
    background: var(--c-bg); color: var(--c-ink);
    border: 1px solid var(--c-edge2);
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    font-family: var(--font); font-size: 11.5px; font-weight: 500;
    white-space: nowrap; pointer-events: none; z-index: 40;
    opacity: 0; transition: opacity 90ms ease, transform 90ms ease;
  }
  .rail-tile[data-name]:hover::after,
  .rail-tile[data-name]:focus-visible::after {
    opacity: 1; transform: translateY(-50%) translateX(0);
  }
  @media (prefers-reduced-motion: reduce) {
    .rail-tile[data-name]::after { transition: none; }
  }

  /* Being dragged into a new position.
     The tile you are holding fades in place and the others move aside to open
     the gap it would drop into, which is the only thing that actually shows
     where it will land. */
  .rail-tile.dragging { opacity: .3; }
  .rail-tile.shifting { transition: transform 160ms cubic-bezier(.2,.7,.3,1); }
  @media (prefers-reduced-motion: reduce) { .rail-tile.shifting { transition: none; } }
  :root[data-motion="off"] .rail-tile.shifting { transition: none; }
  /* The label would follow the tile as it slides, which is noise during a drag. */
  .rail-tile.shifting::after, .rail-tile.dragging::after { opacity: 0 !important; }

  /* AI providers, in settings. */
  .provider-list { display: flex; flex-direction: column; gap: var(--s2); max-width: 70ch; }
  .provider {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s3); border: 1px solid var(--line-soft);
    border-radius: var(--r-sm); background: var(--surface);
  }
  .pdot {
    width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px;
    background: var(--ink-faint);
  }
  .pdot.on { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 18%, transparent); }
  .pname { font-weight: 600; }
  .pfix {
    font-size: 11px; padding: 3px 7px; border-radius: 4px;
    background: var(--raised); color: var(--ink-dim); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 34ch;
  }
  .provider-foot { display: flex; justify-content: flex-end; }
  .setting-sub { margin-top: var(--s4); }
  .setting-sub h4 { margin: 0 0 3px; font-size: 13px; font-weight: 600; }
  .setting-sub p { margin: 0 0 var(--s3); }

  /* Session row actions. Hidden until the row is wanted, so a column of
     sessions is names rather than names plus buttons. */
  .gs .srow-acts {
    display: flex; align-items: center; gap: 1px; margin-left: auto;
    opacity: 0; transition: opacity 90ms ease;
  }
  .gs:hover .srow-acts, .gs:focus-within .srow-acts { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .gs .srow-acts { transition: none; } }
  .srow-btn {
    border: 0; background: transparent; color: var(--ink-faint);
    width: 18px; height: 18px; padding: 0; border-radius: 4px;
    display: grid; place-items: center; font-size: 12px; line-height: 1; cursor: default;
  }
  .srow-btn:hover { background: var(--raised); color: var(--ink); }
  .srow-btn.close:hover { color: var(--crit); }
  /* The name gives up its space to the buttons rather than pushing them out. */
  .gs .nm { min-width: 0; }

  /* A chip that is switched on, rather than merely available. */
  .gpill.hot { border-color: var(--c-acc); color: var(--c-acc-ink); background: color-mix(in srgb, var(--c-acc) 10%, transparent); }
  .gpill[role="button"]:hover { border-color: var(--c-edge2); color: var(--c-mut); }
  .gpill.hot[role="button"]:hover { border-color: var(--c-acc); color: var(--c-acc-ink); }

  /* Loading -------------------------------------------------------------- */
  .spinner {
    width: 13px; height: 13px; flex: 0 0 13px; border-radius: 50%;
    border: 1.5px solid color-mix(in srgb, var(--accent) 26%, transparent);
    border-top-color: var(--accent);
    animation: spin .62s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pane-loading {
    display: flex; align-items: center; justify-content: center; gap: var(--s2);
    padding: var(--s6) var(--s4); color: var(--ink-faint); font-size: 12px;
  }
  .provider-probing {
    display: flex; align-items: center; gap: var(--s2);
    padding: var(--s3); border: 1px solid var(--line-soft); border-radius: var(--r-sm);
    background: var(--surface); color: var(--ink-faint); font-size: 12px;
  }

  /* A spinner that cannot spin is a dot, which says nothing. Under reduced
     motion it pulses instead, which carries the same meaning without rotating. */
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: pulse 1.1s ease-in-out infinite; border-top-color: var(--accent); }
  }
  :root[data-motion="off"] .spinner { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  /* Chat and Terminal, two faces of one pane. */
  .pane-tabs {
    display: flex; align-items: center; gap: var(--s1);
    padding: 6px 12px 0; flex: 0 0 auto;
    border-bottom: 1px solid var(--c-edge); min-height: 38px;
  }
  .pane-tab {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: var(--r-sm);
    border: 1px solid transparent; color: var(--c-faint);
    font-size: 12px; cursor: default;
  }
  .pane-tab:hover { color: var(--c-ink); }
  .pane-tab.on {
    color: var(--c-acc-ink); border-color: color-mix(in srgb, var(--c-acc) 45%, transparent);
    background: color-mix(in srgb, var(--c-acc) 8%, transparent);
  }
  .pane-kbd { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--c-faint); }

  /* Terminal ------------------------------------------------------------
     Dark in both themes, on purpose. A terminal is dark everywhere else on the
     machine, and one that turns white with the rest of the interface stops
     reading as a terminal at all, which is exactly what happened when these
     used the theme tokens. So the colours here are fixed rather than tokens. */
  .term {
    --t-bg:     #0b0c0e;
    --t-ink:    #e7e8ea;
    --t-dim:    #8b8e95;
    --t-where:  #6fa1ff;
    --t-sigil:  #ff5800;
    --t-err:    #e2685f;
    --t-meta:   #96e3a6;

    flex: 1; min-height: 0; display: flex; flex-direction: column;
    margin: 10px 12px 12px; border-radius: var(--r);
    background: var(--t-bg);
    border: 1px solid #1c1e22;
    overflow: hidden;
    /* The scrollback is the whole surface, so clicking anywhere in the dark
       lands in the prompt rather than doing nothing. */
    cursor: text;
  }
  .term-out {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 12px 14px 14px;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
    color: var(--t-ink);
  }
  .term-out::-webkit-scrollbar-thumb { background: #2a2d33; background-clip: content-box; }
  .term-empty { color: var(--t-dim); display: flex; flex-direction: column; gap: 4px; padding-bottom: 10px; }

  .term-cmd, .term-prompt-row { display: flex; align-items: flex-start; gap: 7px; margin-top: 9px; }
  .term-cmd:first-child, .term-prompt-row:first-child { margin-top: 0; }
  .term-where { color: var(--t-where); flex: 0 0 auto; }
  .term-sigil { color: var(--t-sigil); flex: 0 0 auto; }
  .term-typed { color: var(--t-ink); overflow-wrap: anywhere; }

  .term-line { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; color: var(--t-dim); }
  .term-line.err { color: var(--t-err); }
  /* Exit codes and dropped-output notices: the app talking, not the command. */
  .term-line.meta { color: var(--t-meta); font-size: 10.5px; opacity: .85; }

  /* The prompt is the last line of the scrollback rather than a control below
     it, so the caret sits exactly where the next output will appear. */
  .term-input {
    flex: 1; border: 0; background: transparent; outline: none; resize: none;
    color: var(--t-ink); font: inherit; padding: 0; margin: 0;
    caret-color: var(--t-sigil); overflow: hidden;
  }
  .term-input:disabled { opacity: .45; }
  .term-stop {
    border: 1px solid #33363c; background: transparent; color: var(--t-dim);
    font-family: var(--mono); font-size: 10px; padding: 1px 7px; border-radius: 4px;
    cursor: default; flex: 0 0 auto;
  }
  .term-stop:hover { color: var(--t-err); border-color: var(--t-err); }

  .pane-tab .sd.live { width: 7px; height: 7px; }
  /* A turn that failed. Not an alarm: the tab is still there and still works,
     and this is only saying the last thing it tried did not. */
  .pane-tab .sd.bad {
    width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; background: var(--crit);
  }

  /* The agents this machine does not have. Said once, at the end of the strip,
     rather than as tabs that are always there and never work. */
  .pane-miss {
    font-size: 11px; color: var(--ink-faint); padding: 0 var(--s2);
    align-self: center; white-space: nowrap;
  }
  .pane-miss:hover { color: var(--accent-ink); }


  /* Repository state, under the sessions. */
  .gitfoot { margin-top: var(--s4); padding-top: var(--s3); border-top: 1px solid var(--line-soft); }
  .gitfoot:empty { display: none; }
  .gf-head { display: flex; align-items: center; gap: var(--s2); padding: 0 4px 5px; }
  .gf-branch {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0;
  }
  .gf-sync { display: flex; gap: 5px; font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }
  .gf-sync.on { color: var(--accent); }
  .gf-sync.none { font-size: 9.5px; }
  .gf-row { display: flex; align-items: center; gap: var(--s2); padding: 0 4px; }
  .gf-count { font-size: 11px; color: var(--ink-dim); flex: 1; }

  /* Between asking and the first word coming back. */
  .thinking { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .thinking-dots { display: inline-flex; align-items: center; gap: 4px; }
  .thinking-dots i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--c-acc);
    opacity: .3; animation: think 1.15s ease-in-out infinite;
  }
  .thinking-dots i:nth-child(2) { animation-delay: .16s; }
  .thinking-dots i:nth-child(3) { animation-delay: .32s; }
  @keyframes think { 0%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
  .thinking-label { font-size: 11.5px; color: var(--c-faint); }

  /* Still says something is happening without moving anything. */
  @media (prefers-reduced-motion: reduce) {
    .thinking-dots i { animation: none; opacity: .75; }
  }
  :root[data-motion="off"] .thinking-dots i { animation: none; opacity: .75; }
</style>
</head>
<body>
  <header class="titlebar">
    <!-- The name sits with the window chrome now. The mark went to the rail,
         where it is the way back to everything rather than decoration. -->
    <span class="wordmark">Delphi<span class="sub">Oracle</span></span>
    <div class="search"><input id="search" type="search" placeholder="Ask the Oracle, or search" aria-label="Ask the Oracle" /></div>
    <div class="spacer"></div>
  </header>

  <div class="body">
    <!-- The project rail. Painted by renderRail() in the same pass as the
         sidebar, so the two can never disagree about which project is open. -->
    <nav class="project-rail" id="rail" aria-label="Projects"></nav>
    <nav class="sidebar">
      <!-- The project's own panel. The rail is how you move between projects,
