<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Delphi</title>
<link rel="stylesheet" href="assets/fonts.css" />
<style>
  /* Tokens ---------------------------------------------------------------
     Light is the base set; dark redefines the same names. Components only
     ever reference tokens, so neither theme can end up with one theme's ink
     on the other's ground. */
  :root {
    /* Rad, the design language Granular is built with. The names below are the
       ones every component in this app already uses, so redefining them here
       restyles the whole window rather than only what has been rewritten. The
       --rad-* originals are kept alongside for anything built against them
       directly. */
    --rad-bg:          #fbfbfa;
    --rad-surface:     #ffffff;
    --rad-edge:        #e2e2de;
    --rad-edge-strong: #d3d3cd;
    --rad-ink:         #14150f;
    --rad-ink-muted:   #5f6156;
    --rad-ink-faint:   #8e9086;
    --rad-accent:      #c2410c;
    --rad-accent-ink:  #9a3412;
    --rad-danger:      #b4283f;
    --rad-success:     #1a7a48;

    --bg:        var(--rad-bg);
    --surface:   var(--rad-surface);
    --raised:    #f2f2f0;
    --line:      var(--rad-edge);
    --line-soft: #ebebe7;

    /* Chrome, and the canvas it frames.
       The one structural idea in this palette: everything that is the
       application sits a shade behind everything that is the work. The rail is
       darkest, the sidebar next, the content is the brightest thing on screen.
       Without it a window like this reads as one undifferentiated sheet with
       lines drawn on it, and nothing tells your eye where the work is. */
    --chrome:      #f4f4f1;
    --chrome-deep: #eeeee9;

    --ink:       var(--rad-ink);
    --ink-dim:   var(--rad-ink-muted);
    --ink-faint: var(--rad-ink-faint);

    --accent:      var(--rad-accent);
    --accent-ink:  var(--rad-accent-ink);
    /* The orange at 8%, which is the tint Rad uses behind a selected row. A flat
       pastel would fight the accent rather than belong to it. */
    --accent-soft: #fff1e9;
    --good:      var(--rad-success);
    --warn:      #a8700f;
    --crit:      var(--rad-danger);

    /* The gradient primary button, lifted whole: a fill, a border that darkens
       down the edge, and a shadow tinted with the accent rather than with black. */
    --btn-fg:           #fff;
    --btn-fill:         linear-gradient(180deg, #ff6b1a 0%, #ff5800 46%, #e64f00 100%);
    --btn-layer-border: linear-gradient(180deg, #ff8a3d 0%, #b83f00 100%);
    --btn-layer-shadow: 0 .12073px .60363px rgba(255,88,0,.22), 0 1px 5px rgba(170,57,0,.42);

    /* Task colours. A label, not a status, so they sit apart from the semantic
       four above. Each is dark enough to read as text on --surface here and is
       replaced by a lighter one in the dark set, which is the whole reason a
       task stores the name and not the hex. */
    --tc-blue:   #2c6bd8;
    --tc-teal:   #0f7a80;
    --tc-green:  #2f8757;
    --tc-amber:  #8a6a00;
    --tc-orange: #b4581f;
    --tc-red:    #c04a41;
    --tc-purple: #7b4bd1;
    --tc-slate:  #5a6376;

    /* Spacing scale. Everything uses these, so rhythm stays consistent
       rather than being decided per component. */
    --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
    --s5: 24px; --s6: 32px; --s7: 48px;

    /* Tighter than they were. A large radius reads as friendly and costs
       density, and this is a window somebody keeps open all day with four
       agents running in it. */
    --r-sm: 4px; --r: 6px; --r-lg: 9px;

    --font:    'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --display: 'Inter Tight', 'Inter', system-ui, sans-serif;
    --mono:    'Sometype Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    /* Almost nothing. Depth is carried by the chrome and canvas difference
       above, so a shadow on top of it is a second answer to a question already
       answered. What is left is only enough to lift a menu off the page. */
    --shadow: 0 1px 2px rgba(16, 20, 14, 0.06), 0 6px 20px rgba(16, 20, 14, 0.10);
  }

  /* The dark set applies in two cases: when the system asks for dark and the
     user has not overridden it, and when the user has chosen dark outright.
     Following the system stays the default, so an untouched install behaves
     exactly as it did before the setting existed.

     The declarations are repeated below rather than shared, for the same reason
     the reduced-motion rules further down are: a media query condition cannot be
     OR'd into a selector list. The two blocks have to be identical and have to be
     edited together. They were not: the explicit block kept the light --tc-*
     values, so choosing Dark in Settings painted dark task colours on the dark
     ground and the amber and slate labels were nearly unreadable. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --rad-bg:      #1a1b1d;
      --rad-surface: #202124;
      --rad-edge:    #313337;
      --rad-ink:     #f3f3f0;

      --bg:        #1a1b1d;
      --surface:   #202124;
      --raised:    #292a2e;
      --line:      #3a3c40;
      --line-soft: #292a2e;

      /* The same idea as light, inverted the same way round: the chrome is
         darker than the work, not lighter. Reversing it here would put the
         brightest thing on screen at the edges. */
      --chrome:      #141517;
      --chrome-deep: #0f1012;

      --ink:       #f3f3f0;
      --ink-dim:   #a4a69d;
      --ink-faint: #76786f;

      /* The accent shifts, which it did not before, because the redesign moved
         to a deeper burnt orange. #c2410c is right on paper and disappears into
         a dark ground, so dark gets the lighter sibling and --accent-ink goes
         lighter again for text. Same hue, two weights: the alternative was one
         orange that is slightly wrong in both places. */
      --accent:      #f4762e;
      --accent-ink:  #fb9a63;
      --accent-soft: #2c1a11;
      --good:      #96e3a6;
      --warn:      #e0a458;
      --crit:      #e2685f;

      --tc-blue:   #7c9bff;
      --tc-teal:   #4fc4c0;
      --tc-green:  #4fb477;
      --tc-amber:  #e0b95c;
      --tc-orange: #f0925c;
      --tc-red:    #e2685f;
      --tc-purple: #b48bf0;
      --tc-slate:  #98a1b2;

      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.28);
    }
  }

  :root[data-theme="dark"] {
    --rad-bg:      #1a1b1d;
    --rad-surface: #202124;
    --rad-edge:    #313337;
    --rad-ink:     #f3f3f0;

    --bg:        #1a1b1d;
    --surface:   #202124;
    --raised:    #292a2e;
    --line:      #3a3c40;
    --line-soft: #292a2e;

    /* The same idea as light, inverted the same way round: the chrome is
       darker than the work, not lighter. Reversing it here would put the
       brightest thing on screen at the edges. */
    --chrome:      #141517;
    --chrome-deep: #0f1012;

    --ink:       #f3f3f0;
    --ink-dim:   #a4a69d;
    --ink-faint: #76786f;

    /* The accent shifts, which it did not before, because the redesign moved
       to a deeper burnt orange. #c2410c is right on paper and disappears into
       a dark ground, so dark gets the lighter sibling and --accent-ink goes
       lighter again for text. Same hue, two weights: the alternative was one
       orange that is slightly wrong in both places. */
    --accent:      #f4762e;
    --accent-ink:  #fb9a63;
    --accent-soft: #2c1a11;
    --good:      #96e3a6;
    --warn:      #e0a458;
    --crit:      #e2685f;

    --tc-blue:   #7c9bff;
    --tc-teal:   #4fc4c0;
    --tc-green:  #4fb477;
    --tc-amber:  #e0b95c;
    --tc-orange: #f0925c;
    --tc-red:    #e2685f;
    --tc-purple: #b48bf0;
    --tc-slate:  #98a1b2;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.28);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  input, textarea, select, button { font: inherit; color: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-faint); background-clip: content-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
  /* The two global motion levers: the system preference, and the app's own
     Animation setting, which the renderer expresses as data-motion on the root.
     The declarations are duplicated because a media query condition cannot be
     OR'd into a selector list. Both are blanket * rules, so any keyframe or
     transition added later is covered without either of them being touched. */
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  :root[data-motion="off"] * { transition: none !important; animation: none !important; }

  /* Title bar ------------------------------------------------------------ */
  .titlebar {
    height: 46px; flex: 0 0 46px;
    -webkit-app-region: drag;
    display: flex; align-items: center; gap: var(--s3);
    padding: 0 var(--s5);
    transition: padding 120ms ease;
    border-bottom: 1px solid var(--line-soft);
    background: var(--surface);
  }
  /* Room for the window buttons, on whichever side the platform puts them.
     macOS insets its traffic lights into the left of this bar. Windows draws its
     minimise, maximise and close over the right of it. Neither is visible to the
     stylesheet, so the class comes from the main process, which is the only place
     that knows. */
  body.mac .titlebar { padding-left: 88px; }
  body.overlay .titlebar { padding-right: 148px; }
  .search { -webkit-app-region: no-drag; flex: 1; max-width: 520px; position: relative; }
  /* The field sat a shade darker than the bar it lives in, with a hairline
     border, so on a dark ground it read as empty space rather than as somewhere
     to type. It now carries a visible edge at rest and a ring on focus. */
  .search input {
    width: 100%; padding: 8px 12px 8px 32px;
    border-radius: var(--r-sm);
    border: 1px solid var(--ink-faint);
    background: var(--bg); color: var(--ink); outline: none;
    transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
  }
  .search input::placeholder { color: var(--ink-faint); }
  .search input:hover { border-color: var(--ink-dim); }
  .search input:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  .search::before {
    content: "⌕"; position: absolute; left: 11px; top: 50%; transform: translateY(-52%);
    color: var(--ink-faint); font-size: 15px; pointer-events: none;
  }
  .titlebar .spacer { flex: 1; }
  /* A frameless panel has no traffic lights to avoid. */
  body.panel .titlebar { padding-left: var(--s5); }

  .body { flex: 1; display: flex; min-height: 0; }

  /* Identity ------------------------------------------------------------- */
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: var(--s4) var(--s4) var(--s3);
    -webkit-app-region: drag;
  }
  /* The app's own icon, rather than a gradient square standing in for it. The 2x
     file is drawn at 26px so it stays sharp on a retina display. */
  .mark {
    width: 26px; height: 26px; flex: 0 0 26px; border-radius: 8px;
    display: block;
    box-shadow: 0 2px 8px rgba(16, 20, 28, 0.28);
  }
  .wordmark { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .wordmark .sub {
    display: block; font-size: 10px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-faint); margin-top: -1px;
  }

  /* Sidebar -------------------------------------------------------------- */
  .sidebar {
    width: 254px; flex: 0 0 254px;
    background: var(--surface);
    border-right: 1px solid var(--line-soft);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sidebar-scroll { overflow-y: auto; flex: 1; padding: var(--s3); }
  .side-label {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--ink-faint); padding: var(--s3) var(--s2) var(--s2);
  }
  .proj {
    position: relative;
    display: flex; align-items: center; gap: var(--s3);
    padding: 9px var(--s3); border-radius: var(--r-sm);
    cursor: default; -webkit-user-select: none; user-select: none;
    transition: background 100ms ease;
  }
  .proj:hover { background: var(--raised); }
  .proj.active { background: var(--accent-soft); }
  .proj.active .proj-name { color: var(--accent); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 7px; }
  .proj-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count {
    font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600;
    color: var(--ink-faint); min-width: 20px; text-align: right;
    transition: opacity 120ms ease;
  }
  /* The actions button takes the count's place while the row is hovered rather
     than sitting beside it. A permanent slot for it would cost this 254px
     sidebar 32px of project name on every row, to show a control that is only
     wanted on the one row under the pointer, and a slot that appears on hover
     would reflow the name out from under the cursor. Both stay where they are
     and one fades over the other. Only where there is a button to swap in: All
     work has no menu, and its count blinking out under the pointer would be a
     row saying it can be acted on when it cannot. */
  .proj:has(.proj-more):hover .count { opacity: 0; }
  .proj-more {
    position: absolute; right: 6px;
    width: 22px; height: 22px; padding: 0;
    border: 0; border-radius: 6px; background: none;
    color: var(--ink-faint); font-size: 15px; line-height: 1; cursor: default;
    opacity: 0; pointer-events: none;
    transition: opacity 120ms ease, background 120ms ease;
  }
  .proj:hover .proj-more, .proj-more:focus-visible { opacity: 1; pointer-events: auto; }
  /* Reached by keyboard, where there is no hover to paint the row behind it. */
  .proj-more:focus-visible { background: var(--raised); color: var(--ink); }
  /* Filled with whatever the row is painted in, because a long project name
     ellipsises under this button rather than stopping short of it. Transparent
     left the glyph sitting in the middle of the last two letters of the name. */
  .proj:hover .proj-more { background: var(--raised); }
  .proj.active:hover .proj-more { background: var(--accent-soft); }
  .proj:hover .proj-more:hover, .proj.active:hover .proj-more:hover {
    background: var(--line); color: var(--ink);
  }
  .sidebar-foot { border-top: 1px solid var(--line-soft); padding: var(--s3); }
  /* With no project open the foot holds nothing, and the border alone reads as a
     bar the eye keeps looking for content in. */
  .sidebar-foot:empty { display: none; }

  /* Buttons -------------------------------------------------------------- */
  .btn {
    -webkit-app-region: no-drag;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink-dim);
    padding: 7px 13px; border-radius: var(--r-sm); cursor: default;
    transition: background 100ms ease, border-color 100ms ease, color 100ms ease;
  }
  .btn:hover { background: var(--raised); color: var(--ink); border-color: var(--ink-faint); }
  .btn.wide { width: 100%; }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); color: #fff; }
  /* Outlined at rest and filled only on hover, which is the treatment .ctx-item
     .danger already uses: a destructive verb should be legible as one without
     shouting from the middle of a settings pane. */
  .btn.danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, transparent); }
  .btn.danger:hover { background: var(--crit); border-color: var(--crit); color: #fff; }
  .btn:disabled { opacity: 0.45; }
  .btn.danger:disabled:hover { background: var(--surface); color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, transparent); }

  /* Main ----------------------------------------------------------------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .head { padding: var(--s5) var(--s6) 0; background: var(--surface); border-bottom: 1px solid var(--line-soft); }
  .head-top { display: flex; align-items: flex-start; gap: var(--s4); }
  .head h1 {
    margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -0.02em;
    text-wrap: balance;
  }
  .head .sub { color: var(--ink-dim); margin-top: 5px; max-width: 68ch; }

  /* Sits beside the title rather than in the toolbar, so it reads as "back from
     this thing" rather than as a global control. Hidden with the hidden
     attribute when there is nowhere to go, because a permanently dead button
     teaches people to ignore it. */
  .back {
    flex: 0 0 auto; margin-top: 3px;
    width: 30px; height: 30px; padding: 0;
    display: grid; place-items: center;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-dim); cursor: default;
    transition: background 100ms ease, color 100ms ease, border-color 100ms ease;
  }
  .back[hidden] { display: none; }
  .back:hover { background: var(--raised); color: var(--ink); border-color: var(--ink-faint); }
  .back:active { background: var(--raised); }
  .back svg { width: 16px; height: 16px; }

  /* Header metrics. Compact siblings of the dashboard tiles: same information
     design, less weight, so they read as context rather than as content. */
  .metrics { display: flex; gap: var(--s5); flex: 0 0 auto; padding-top: 4px; }
  .metric { text-align: right; min-width: 54px; }
  .metric .v {
    font-size: 20px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .metric .k {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-faint); font-weight: 600; margin-top: 2px;
  }
  .metric.warn .v { color: var(--warn); }
  .metric.crit .v { color: var(--crit); }
  .metric.good .v { color: var(--accent); }
  .metric.zero .v { color: var(--ink-faint); font-weight: 500; }
  @media (max-width: 900px) { .metrics { display: none; } }
  .tabs { display: flex; gap: var(--s1); margin-top: var(--s5); }
  .tab {
    padding: 8px var(--s3); color: var(--ink-dim); cursor: default;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color 100ms ease, border-color 100ms ease;
  }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab .n { color: var(--ink-faint); font-variant-numeric: tabular-nums; font-weight: 400; margin-left: 3px; }

  .content { flex: 1; overflow-y: auto; padding: var(--s5) var(--s6) var(--s7); min-height: 0; }

  /* Oracle --------------------------------------------------------------- */
  .oracle-bar {
    display: flex; gap: var(--s2); align-items: center; margin-bottom: var(--s4);
  }
  .oracle-input {
    flex: 1; padding: 11px 14px; border-radius: var(--r);
    border: 1px solid var(--line); background: var(--surface); outline: none;
    font-size: 14px;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .oracle-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent);
  }
  .provider-tag {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    color: var(--ink-faint); padding: 4px 9px; border-radius: 20px;
    border: 1px solid var(--line); white-space: nowrap;
  }
  .provider-tag.neural { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

  .hit { display: flex; gap: var(--s4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft); }
  .hit:last-child { border-bottom: 0; }
  .hit:hover { background: var(--raised); }
  /* The score is a bar as well as a number: a column of bars is scannable in a
     way a column of decimals is not. */
  .score { flex: 0 0 46px; padding-top: 3px; }
  .score .n { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .score .bar { height: 3px; border-radius: 2px; background: var(--line); margin-top: 4px; overflow: hidden; }
  .score .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .hit-body { flex: 1; min-width: 0; }
  .hit-title { font-weight: 550; }
  .hit-snip { color: var(--ink-dim); font-size: 12.5px; line-height: 1.55; margin-top: 4px; }

  .entity-cloud { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .ent {
    font-size: 12px; padding: 4px 10px; border-radius: 20px;
    background: var(--raised); border: 1px solid transparent; cursor: default;
    transition: border-color 100ms ease, color 100ms ease;
  }
  .ent:hover { border-color: var(--accent); color: var(--accent); }
  .ent b { font-weight: 600; }
  .ent .c { color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-left: 5px; font-size: 11px; }

  /* Mind map ------------------------------------------------------------
     A colour per entity kind, mixed from the palette that is already here
     rather than picked fresh, so the map cannot end up with a hue that only
     works in one theme. The canvas cannot read a token, so it resolves these
     through a probe element and follows a theme change with them. */
  :root {
    --graph-service: var(--good);
    --graph-ticket:  var(--accent);
    --graph-concept: color-mix(in srgb, var(--accent) 40%, var(--crit));
    --graph-repo:    color-mix(in srgb, var(--good) 60%, var(--accent));
    --graph-file:    var(--ink-faint);
    --graph-env:     var(--warn);
    --graph-person:  color-mix(in srgb, var(--crit) 75%, var(--warn));
    --graph-pr:      color-mix(in srgb, var(--warn) 60%, var(--accent));
  }

  .mm-tools { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s3); }
  .mm-legend { display: flex; flex-wrap: wrap; gap: var(--s2); flex: 1; }
  .mm-key {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; padding: 3px 9px; border-radius: 20px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim);
    cursor: default;
    transition: opacity 100ms ease, border-color 100ms ease, color 100ms ease;
  }
  .mm-key:hover { border-color: var(--ink-faint); color: var(--ink); }
  /* Switched off rather than removed: the count is still worth reading, and a
     legend that loses entries as you use it stops being a legend. */
  .mm-key.off { opacity: 0.42; }
  .mm-key .c { color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .mm-swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: 0 0 8px; }
  .mm-limit { width: auto; flex: 0 0 auto; }

  .mm-wrap {
    display: grid; grid-template-columns: minmax(0, 1fr) 300px;
    gap: var(--s4); align-items: start;
  }
  @media (max-width: 1000px) { .mm-wrap { grid-template-columns: 1fr; } }

  .mm-stage {
    position: relative; height: 58vh; min-height: 360px;
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--r); overflow: hidden;
  }
  .mm-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* The one element whose only job is to resolve a token into a colour the
     canvas can use. */
  .mm-probe { position: absolute; width: 0; height: 0; overflow: hidden; visibility: hidden; }

  .mm-readout {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2);
    padding: var(--s2) var(--s3);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    border-top: 1px solid var(--line-soft);
    font-size: 12px; color: var(--ink-dim);
    pointer-events: none;
  }
  .mm-readout:empty { display: none; }
  .mm-readout b { color: var(--ink); font-weight: 600; }
  .mm-kind {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-faint); border: 1px solid var(--line); border-radius: 20px; padding: 1px 7px;
  }

  .mm-panel {
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--r); padding: var(--s3) var(--s4) var(--s4);
    max-height: 58vh; overflow-y: auto;
  }
  .mm-panel .side-label { padding-left: 0; }
  .mm-panel .empty { padding: var(--s5) 0; text-align: left; }
  .mm-head { display: flex; align-items: flex-start; gap: var(--s2); }
  .mm-head h3 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .mm-search { width: 100%; margin-top: var(--s3); }
  .mm-note { margin-top: var(--s2); }

  .mm-list { display: flex; flex-direction: column; gap: 3px; }
  .mm-row {
    display: flex; align-items: center; gap: var(--s2); width: 100%; text-align: left;
    padding: 6px var(--s2); border-radius: var(--r-sm);
    border: 1px solid transparent; background: transparent; color: inherit; cursor: default;
    transition: background 100ms ease;
  }
  .mm-row:hover { background: var(--raised); }
  .mm-row .c { color: var(--ink-faint); font-variant-numeric: tabular-nums; font-size: 11px; }
  .mm-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }

  .mm-item { padding: var(--s2) var(--s3); border: 1px solid var(--line-soft); border-radius: var(--r-sm); }
  .mm-item.clickable { cursor: default; transition: border-color 100ms ease, background 100ms ease; }
  .mm-item.clickable:hover, .mm-item.clickable:focus-visible { border-color: var(--accent); background: var(--raised); }
  .mm-item-title { line-height: 1.45; }
  /* The sentence the edge was drawn from. It is the reason to believe the edge,
     so it is quoted rather than summarised. */
  .mm-ev {
    margin-top: 5px; font-size: 11.5px; color: var(--ink-faint);
    border-left: 2px solid var(--line); padding-left: var(--s2);
  }

  .mm-foot { margin-top: var(--s2); }

  /* Dashboard ------------------------------------------------------------ */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: var(--s3); margin-bottom: var(--s5); }
  .stat {
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--r); padding: var(--s4) var(--s4) var(--s3);
  }
  .stat .v { font-size: 28px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin-top: 5px; font-weight: 600; }
  .stat.warn .v { color: var(--warn); }
  .stat.crit .v { color: var(--crit); }
  .stat.good .v { color: var(--good); }

  /* A tile that filters the task list has to look like it does something before
     it is hovered, or nobody discovers it. The arrow carries that at rest and
     the whole tile lifts on hover. A tile leading nowhere -- a count of zero --
     keeps the flat treatment rather than promising a view with nothing in it. */
  .stat.act {
    cursor: default; position: relative;
    text-align: left; width: 100%; font: inherit; color: inherit;
    transition: border-color 100ms ease, background 100ms ease, transform 100ms ease;
  }
  .stat.act::after {
    content: "→"; position: absolute; top: var(--s3); right: var(--s3);
    color: var(--ink-faint); font-size: 12px; opacity: 0.55;
    transition: opacity 100ms ease, transform 100ms ease, color 100ms ease;
  }
  .stat.act:hover, .stat.act:focus-visible {
    background: var(--raised); border-color: var(--ink-faint); transform: translateY(-1px);
  }
  .stat.act:hover::after, .stat.act:focus-visible::after {
    opacity: 1; color: var(--accent); transform: translateX(2px);
  }
  .stat.act:active { transform: translateY(0); }

  /* Segmented control ------------------------------------------------------
     Used where a setting has three or fewer states and seeing the alternatives
     matters as much as seeing the current one. */
  .seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--raised); border-radius: var(--r-sm); border: 1px solid var(--line-soft); }
  .seg button {
    background: transparent; border: 1px solid transparent; color: var(--ink-dim);
    padding: 5px 12px; border-radius: 5px; cursor: default;
    transition: background 100ms ease, color 100ms ease;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] {
    background: var(--surface); color: var(--ink); font-weight: 600;
    border-color: var(--line); box-shadow: 0 1px 2px rgba(16, 20, 28, 0.06);
  }

  /* Active filter, shown so a filtered list never looks like an empty one. */
  .filter-note { display: flex; align-items: center; gap: var(--s2); margin-bottom: var(--s3); color: var(--ink-dim); }

  /* Rendered markdown ------------------------------------------------------
     Memory notes are written as markdown by agents and read by people. These
     are deliberately tight: the note is the content, so headings do not need
     display sizes. */
  .md { line-height: 1.65; overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3 { margin: var(--s5) 0 var(--s2); font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; }
  .md h1 { font-size: 17px; }
  .md h2 { font-size: 15px; }
  .md h3 { font-size: 13.5px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.05em; font-size: 11.5px; }
  .md p { margin: 0 0 var(--s3); }
  .md ul, .md ol { margin: 0 0 var(--s3); padding-left: var(--s5); }
  .md li { margin-bottom: 5px; }
  .md code {
    font-family: var(--mono); font-size: 12px;
    background: var(--raised); padding: 1.5px 5px; border-radius: 4px;
  }
  .md pre {
    background: var(--raised); border: 1px solid var(--line-soft); border-radius: var(--r);
    padding: var(--s3) var(--s4); overflow-x: auto; margin: 0 0 var(--s3);
  }
  .md pre code { background: none; padding: 0; font-size: 12px; line-height: 1.6; }
  .md blockquote {
    margin: 0 0 var(--s3); padding: 2px 0 2px var(--s4);
    border-left: 2px solid var(--line); color: var(--ink-dim);
  }
  .md hr { border: 0; border-top: 1px solid var(--line-soft); margin: var(--s5) 0; }
  /* Notes lean on tables heavily, and a wide one must scroll inside the note
     rather than stretching the pane it lives in. */
  .md .table-wrap { overflow-x: auto; margin: 0 0 var(--s3); }
  .md table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .md th, .md td { border: 1px solid var(--line-soft); padding: 6px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--raised); font-weight: 600; white-space: nowrap; }
  .md strong { font-weight: 650; }

  /* The rendered pane inside the full-size sheet gets the same frame the
     textarea has, so toggling does not move the content. */
  .sheet-body .md {
    flex: 1; overflow-y: auto;
    border: 1px solid var(--line); border-radius: var(--r);
    background: var(--bg); padding: var(--s4) var(--s5);
    /* Matched to .sheet-body textarea below, deliberately. Rendered markdown
       otherwise inherits the 13px body size while the editor is set to 14px, so
       clicking the text to edit made everything jump a size. Only the typeface
       should change between reading and editing, not the measure. */
    font-size: 14px; line-height: 1.7;
  }
  .note-body .md {
    border: 1px solid var(--line); border-radius: var(--r-sm);
    background: var(--bg); padding: var(--s3) var(--s4);
    max-height: 460px; overflow-y: auto;
  }

  .cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--s5); align-items: start; }
  @media (max-width: 940px) { .cols { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface); border: 1px solid var(--line-soft);
    border-radius: var(--r); overflow: hidden;
  }
  .card + .card { margin-top: var(--s4); }
  .card-head {
    display: flex; align-items: center; gap: var(--s2);
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft);
  }
  .card-head h2 {
    margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--ink-faint); flex: 1;
  }
  .card-body { padding: var(--s4); }
  .card-body.flush { padding: 0; }

  .kv { display: grid; grid-template-columns: 108px 1fr; gap: var(--s3) var(--s4); align-items: baseline; }
  .kv dt { color: var(--ink-faint); font-size: 12px; }
  .kv dd { margin: 0; }

  .field { width: 100%; padding: 7px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--bg); outline: none; }
  .field:focus { border-color: var(--accent); background: var(--surface); }
  textarea.field { resize: vertical; line-height: 1.55; }
  /* A colour well is a swatch, not a line of text, so .field's text padding
     leaves it a sliver of colour inside a large box. Sized to the swatch and kept
     off the full width the rest of the fields take. */
  .field-colour { width: 56px; height: 30px; padding: 2px; }

  /* Tasks ---------------------------------------------------------------- */
  .task {
    display: flex; gap: var(--s3); align-items: flex-start;
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft);
    transition: background 100ms ease;
  }
  .task:last-child { border-bottom: 0; }
  .task:hover { background: var(--raised); }
  .check {
    width: 16px; height: 16px; flex: 0 0 16px; margin-top: 2px;
    border-radius: 5px; border: 1.5px solid var(--ink-faint); cursor: default;
    display: grid; place-items: center; font-size: 10px; color: transparent;
    transition: border-color 100ms ease, background 100ms ease;
  }
  .check:hover { border-color: var(--accent); }
  .task.done .check { background: var(--good); border-color: var(--good); color: #fff; }
  .task.done .t-title { text-decoration: line-through; color: var(--ink-faint); }

  /* Finishing something --------------------------------------------------
     Ticking a task used to do nothing visible except remove the row on the
     next repaint, which reads as "have I just deleted that?" rather than as
     "done". The row now says so first and leaves afterwards.

     The whole of this is switched off by the reduced motion rule further up,
     and the JavaScript checks the same preference so the row does not sit
     there for the length of an animation that is not playing. */
  .task { position: relative; }

  @keyframes task-wiggle {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    18% { transform: translateX(-5px) rotate(-1.2deg); }
    36% { transform: translateX(5px)  rotate(1.2deg); }
    54% { transform: translateX(-3px) rotate(-0.7deg); }
    72% { transform: translateX(3px)  rotate(0.7deg); }
    86% { transform: translateX(-1px) rotate(-0.2deg); }
  }
  @keyframes task-glow {
    0%   { background: transparent; }
    30%  { background: color-mix(in srgb, var(--good) 20%, transparent); }
    100% { background: transparent; }
  }
  @keyframes check-pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.4); }
    75%  { transform: scale(0.92); }
    100% { transform: scale(1); }
  }
  /* Each spark is given its own direction as --dx/--dy, so one keyframe set
     throws all of them outwards without needing a rule per spark. */
  @keyframes spark-fly {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.2) rotate(0deg); }
    22%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1) rotate(160deg); }
  }

  .task.celebrate { animation: task-wiggle 520ms ease-out, task-glow 760ms ease-out; }
  .task.celebrate .check {
    background: var(--good); border-color: var(--good); color: #fff;
    animation: check-pop 440ms cubic-bezier(0.2, 1.7, 0.45, 1);
  }
  .task.celebrate .t-title { text-decoration: line-through; color: var(--ink-faint); }
  /* Placed on the middle of the tick box, not its corner: .task is padded
     12px/16px and .check is 16px square at margin-top 2px, so its centre is
     about (24, 22), less half a glyph. */
  .spark {
    position: absolute; left: 19px; top: 17px;
    font-size: 11px; line-height: 1; color: var(--good);
    pointer-events: none; opacity: 0;
    animation: spark-fly 720ms ease-out forwards;
  }
  .t-body { flex: 1; min-width: 0; }
  .t-title { line-height: 1.45; }
  .t-meta { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: 6px; align-items: center; }

  .chip {
    font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500;
    background: var(--raised); color: var(--ink-dim); border: 1px solid transparent;
    white-space: nowrap;
  }
  .chip.high { color: var(--crit); background: transparent; border-color: var(--crit); }
  .chip.doing { color: var(--accent); background: var(--accent-soft); }
  .chip.blocked { color: var(--warn); background: transparent; border-color: var(--warn); }
  .chip.overdue { color: var(--crit); background: transparent; border-color: var(--crit); font-weight: 600; }
  .chip.ref { font-family: var(--mono); font-size: 11px; }
  .t-detail {
    margin-top: var(--s3); color: var(--ink-dim); white-space: pre-wrap;
    font-size: 12.5px; line-height: 1.6; max-height: 200px; overflow: auto;
    border-left: 2px solid var(--line); padding-left: var(--s3);
  }
  .t-actions { display: flex; gap: var(--s1); opacity: 0; transition: opacity 100ms ease; }
  .task:hover .t-actions, .task:focus-within .t-actions { opacity: 1; }

  /* Notes ---------------------------------------------------------------- */
  /* The pad a task was read out of, on its row in the list. Quiet, because it is
     provenance rather than status: the row is about the work, not about where the
     words came from. */
  .t-pad {
    font-size: 10.5px; padding: 0 5px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--ink-faint);
  }
  .t-pad:hover { border-color: var(--accent); color: var(--accent-ink); }

  /* The harness editor.
     Plain on purpose: the argv is a JSON list and is shown as one. Anything that
     hid it behind checkboxes could only express the flags somebody thought of in
     advance, which is the problem the registry exists to solve. */
  .hsheet { display: flex; flex-direction: column; gap: var(--s4); padding: var(--s4); }
  .hfield { display: flex; flex-direction: column; gap: 5px; }
  .hfield > b { font-size: 12.5px; }
  .hfield > .hint { max-width: 72ch; }
  .hfield select { align-self: flex-start; }
  .hargs {
    min-height: 150px; resize: vertical; border: 1px solid var(--line);
    border-radius: var(--r-sm); background: var(--bg); color: var(--ink);
    padding: var(--s3); font-family: var(--mono); font-size: 12px; line-height: 1.6;
    outline: none;
  }
  .hargs:focus { border-color: var(--accent); }

  /* Work one agent handed to another. */
  .hoff { display: flex; gap: var(--s2); align-items: flex-start; padding: var(--s2) 0; }
  .hoff + .hoff { border-top: 1px solid var(--line-soft); }
  .hoff-s {
    font-size: 10px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600;
    padding: 2px 6px; border-radius: 4px; background: var(--raised); color: var(--ink-faint);
    flex: 0 0 auto; margin-top: 2px; min-width: 64px; text-align: center;
  }
  .hoff-s.running { background: var(--accent-soft); color: var(--accent-ink); }
  .hoff-s.ready { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
  .hoff-s.failed { background: color-mix(in srgb, var(--crit) 12%, transparent); color: var(--crit); }
  .hoff-t { font-weight: 600; font-size: 12.5px; }
  .hoff-r {
    margin-top: 5px; padding: var(--s2); border-radius: var(--r-sm);
    background: var(--raised); color: var(--ink-dim); font-size: 12px;
    white-space: pre-wrap; max-height: 9em; overflow: hidden;
  }

  /* Pads -------------------------------------------------------------------
     The working documents, and the board read out of them.

     Two columns because a pad is chosen and then read, the same shape the chat
     uses for its sessions. The reading column is the one that matters, so the
     list is kept narrow and quiet: it is a way back to the other pads, not a
     thing to look at. */
  .pad-wrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--s4); align-items: start; }
  @media (max-width: 900px) { .pad-wrap { grid-template-columns: 1fr; } }

  .pad-list { display: flex; flex-direction: column; gap: 2px; }
  .pad-row {
    padding: var(--s2) var(--s3); border-radius: var(--r-sm); cursor: default;
    border: 1px solid transparent;
  }
  .pad-row:hover { background: var(--raised); }
  .pad-row.on { background: var(--accent-soft); border-color: var(--accent); }
  .pad-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pad-row-t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pad-row-m { font-size: 11.5px; color: var(--ink-faint); margin-top: 1px; }

  .pad-pane { border: 1px solid var(--line-soft); border-radius: var(--r); background: var(--surface); min-width: 0; }
  .pad-head {
    display: flex; gap: var(--s2); align-items: center;
    padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft);
  }
  .pad-title {
    flex: 1; min-width: 0; border: 1px solid transparent; background: transparent;
    font-weight: 600; padding: 4px 6px; border-radius: var(--r-sm); outline: none;
  }
  .pad-title:hover { border-color: var(--line); }
  .pad-title:focus { border-color: var(--accent); background: var(--bg); }
  .pad-head .btn.on { border-color: var(--accent); color: var(--accent-ink); }

  .pad-source {
    display: block; width: 100%; box-sizing: border-box; min-height: 420px;
    border: 0; outline: none; resize: vertical; background: transparent; color: var(--ink);
    padding: var(--s4); font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
  }

  .pad-board { padding: var(--s3) var(--s4) var(--s4); }
  .pad-prose { margin: var(--s2) 0; }

  /* A checkbox line is rendered as the task it is, not as text with a box in
     front of it. Hence the row treatment: it should read as something with a
     state, sitting inside a document. */
  .pad-line {
    display: flex; align-items: baseline; gap: var(--s2);
    padding: 5px var(--s2); border-radius: var(--r-sm); line-height: 1.5;
  }
  .pad-line:hover { background: var(--raised); }
  .pad-line input[type="checkbox"] { position: relative; top: 2px; accent-color: var(--accent); }
  .pad-line-t { flex: 1; min-width: 0; }
  .pad-line.done .pad-line-t { color: var(--ink-faint); text-decoration: line-through; }
  .pad-line-id { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .pad-line-id[role="button"]:hover { color: var(--accent-ink); }
  .pad-line.d1 { padding-left: calc(var(--s2) + 22px); }
  .pad-line.d2 { padding-left: calc(var(--s2) + 44px); }
  .pad-line.d3 { padding-left: calc(var(--s2) + 66px); }
  .pad-line.d4 { padding-left: calc(var(--s2) + 88px); }

  .pad-line .chip {
    font-size: 10.5px; padding: 1px 6px; border-radius: 4px;
    background: var(--raised); color: var(--ink-dim); white-space: nowrap;
  }
  .pad-line .chip.hi { background: color-mix(in srgb, var(--crit) 12%, transparent); color: var(--crit); }
  .pad-line .chip.st { background: var(--accent-soft); color: var(--accent-ink); }

  .pad-dropped { margin-top: var(--s4); padding-top: var(--s3); border-top: 1px solid var(--line-soft); }
  .pad-dropped-h { font-weight: 600; margin-bottom: 2px; }
  .pad-drop { display: flex; gap: var(--s2); align-items: baseline; padding: 4px var(--s2); border-radius: var(--r-sm); }
  .pad-drop:hover { background: var(--raised); }
  .pad-drop-s { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-faint); min-width: 52px; }

  .note { border: 1px solid var(--line-soft); border-radius: var(--r); background: var(--surface); margin-bottom: var(--s3); }
  .note-head { display: flex; gap: var(--s2); align-items: center; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-soft); }
  .note-head input { flex: 1; border: 1px solid transparent; background: transparent; font-weight: 600; padding: 4px 6px; border-radius: var(--r-sm); outline: none; }
  .note-head input:hover { border-color: var(--line); }
  .note-head input:focus { border-color: var(--accent); background: var(--bg); }
  .note-body { padding: var(--s3) var(--s4) var(--s4); }
  .kind {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    padding: 3px 8px; border-radius: 4px; background: var(--raised); color: var(--ink-faint);
  }
  .kind.decision { color: var(--accent); background: var(--accent-soft); }
  .kind.gotcha   { color: var(--warn); background: transparent; border: 1px solid var(--warn); }
  .kind.reference{ color: var(--good); background: transparent; border: 1px solid var(--good); }

  /* Project activity ------------------------------------------------------
     The same audit trail as the History tab, narrowed to a project, because a
     delete has to be reversible from where it happened. */
  .restore-bar {
    display: flex; align-items: center; gap: var(--s3);
    padding: var(--s3) var(--s4); margin-bottom: var(--s3);
    border: 1px solid var(--warn); border-radius: var(--r);
    background: color-mix(in srgb, var(--warn) 10%, var(--surface));
    color: var(--ink);
  }
  .restore-bar span { flex: 1; font-weight: 550; }
  .act {
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 1px 5px; border-radius: 4px; margin-right: 6px;
    background: var(--raised); color: var(--ink-dim);
  }
  .act-create { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
  .act-delete { background: color-mix(in srgb, var(--crit) 18%, transparent); color: var(--crit); }
  .audit-row.deleted { background: color-mix(in srgb, var(--crit) 5%, transparent); }

  /* Table view ------------------------------------------------------------
     Columns line up so the eye compares down one rather than reading every row.
     The row still opens the task; the controls sit at the end where they do not
     compete with it. */
  .ttable {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); overflow: hidden;
  }
  .trow {
    display: grid;
    grid-template-columns: 34px minmax(0, 1fr) 132px 150px 110px 92px 148px;
    align-items: center; gap: var(--s2);
    padding: 9px var(--s3);
    border-bottom: 1px solid var(--line-soft);
    cursor: default;
  }
  .trow:last-child { border-bottom: 0; }
  .trow:hover { background: var(--raised); }
  .trow.picked { background: var(--accent-soft); }
  .trow.thead {
    background: var(--bg); cursor: default;
    font-size: 10.5px; font-weight: 650; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--ink-faint);
  }
  .trow.thead:hover { background: var(--bg); }
  .trow.done .trow-title { color: var(--ink-faint); text-decoration: line-through; }

  .tcell { min-width: 0; display: flex; align-items: center; gap: 6px; }
  .tcell-name { flex-direction: column; align-items: flex-start; gap: 2px; }
  .trow-title { font-size: 13.5px; line-height: 1.4; }
  .trow-sub { display: flex; gap: var(--s3); font-size: 11px; color: var(--ink-faint); }
  .cell-text { font-size: 12.5px; color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-empty { font-size: 12.5px; color: var(--ink-faint); }
  .queued-mark { font-family: var(--mono); font-size: 10px; color: var(--accent); }
  .pill.muted { color: var(--ink-faint); border-color: var(--line); }

  .cell-select {
    border: 1px solid var(--line); border-radius: 99px;
    background: var(--surface); color: var(--ink-dim);
    padding: 2px 6px; font-size: 11.5px; outline: none; max-width: 100%;
  }
  .cell-select:hover { border-color: var(--ink-faint); }
  .cell-select.st-doing { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .cell-select.st-blocked { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, transparent); }
  .cell-select.st-done { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }

  /* Present rather than hidden until hover. A control nobody can see is a
     control nobody uses, and the row already opens the task on its own. */
  .tcell-actions { justify-content: flex-end; opacity: 0.55; transition: opacity 120ms ease; }
  .trow:hover .tcell-actions, .trow:focus-within .tcell-actions { opacity: 1; }
  .row-btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim);
    border-radius: var(--r-sm); padding: 3px 9px; font-size: 11.5px; cursor: default;
  }
  .row-btn:hover { border-color: var(--accent); color: var(--accent); }
  .row-btn.icon { padding: 3px 7px; }

  .row-check {
    width: 16px; height: 16px; border-radius: 4px; flex: 0 0 16px;
    border: 1.5px solid var(--line); background: var(--surface);
    display: grid; place-items: center; cursor: default;
  }
  .row-check:hover { border-color: var(--accent); }
  .row-check.on { background: var(--accent); border-color: var(--accent); }
  .row-check.on::after { content: "✓"; color: #fff; font-size: 10px; font-weight: 700; }
  .row-check.head { border-style: dashed; }

  .tgroup {
    display: flex; align-items: center; gap: 7px;
    padding: 8px var(--s3); background: var(--bg);
    border-bottom: 1px solid var(--line-soft);
  }
  .tgroup .tcol-dot { width: 7px; height: 7px; border-radius: 99px; background: var(--ink-faint); }
  .tgroup.st-doing .tcol-dot { background: var(--accent); }
  .tgroup.st-blocked .tcol-dot { background: var(--crit); }
  .tgroup.st-done .tcol-dot { background: var(--good); }
  .tgroup-name { font-size: 11px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }

  /* The bar that appears when rows are selected. Floating, so it is near the
     pointer that made the selection and does not shove the table down. */
  .bulk-bar {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    z-index: 70; display: flex; align-items: center; gap: var(--s2);
    background: var(--ink); color: var(--bg);
    border-radius: 99px; padding: 7px 9px 7px var(--s4);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
    animation: bulkIn 140ms ease;
  }
  @keyframes bulkIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .bulk-count { font-size: 12.5px; font-weight: 600; margin-right: var(--s2); white-space: nowrap; }
  .bulk-btn {
    border: 0; border-radius: 99px; padding: 5px 12px;
    background: color-mix(in srgb, var(--bg) 18%, transparent);
    color: var(--bg); font-size: 12px; font-weight: 600; cursor: default;
  }
  .bulk-btn:hover { background: color-mix(in srgb, var(--bg) 32%, transparent); }
  .bulk-btn.danger:hover { background: var(--crit); color: #fff; }
  .bulk-close {
    border: 0; background: none; color: var(--bg); opacity: 0.7;
    font-size: 13px; cursor: default; padding: 4px 6px;
  }
  .bulk-close:hover { opacity: 1; }

  /* Columns and board ------------------------------------------------------
     One column per status. The difference between the two modes is only whether
     the cards can be dragged: a column is a status either way. */
  .tcols {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr);
    gap: var(--s3); align-items: start; overflow-x: auto; padding-bottom: var(--s3);
  }
  .tcol {
    background: var(--raised); border: 1px solid transparent;
    border-radius: var(--r); padding: var(--s2);
    display: flex; flex-direction: column; gap: var(--s2);
    min-height: 120px; transition: border-color 120ms ease, background 120ms ease;
  }
  .tcol.over { border-color: var(--accent); background: var(--accent-soft); }
  .tcol-head { display: flex; align-items: center; gap: 7px; padding: 5px 6px 2px; }
  .tcol-dot { width: 7px; height: 7px; border-radius: 99px; background: var(--ink-faint); }
  .tcol-head.st-doing .tcol-dot { background: var(--accent); }
  .tcol-head.st-blocked .tcol-dot { background: var(--crit); }
  .tcol-head.st-done .tcol-dot { background: var(--good); }
  .tcol-name { font-size: 11.5px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; }
  .tcol-n { font-size: 10.5px; font-weight: 700; color: var(--ink-faint); }
  .tcol-body { display: flex; flex-direction: column; gap: var(--s2); }
  .tcol-empty {
    border: 1px dashed var(--line); border-radius: var(--r-sm);
    padding: var(--s4); text-align: center; color: var(--ink-faint); font-size: 11.5px;
  }
  .tcol-add {
    border: 1px solid transparent; background: transparent; border-radius: var(--r-sm);
    padding: 7px 8px; font-size: 12.5px; color: var(--ink); outline: none; width: 100%;
  }
  .tcol-add:hover { border-color: var(--line); }
  .tcol-add:focus { border-color: var(--accent); background: var(--surface); }

  .tcard {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 9px 10px;
    display: flex; flex-direction: column; gap: 6px; cursor: default;
    transition: border-color 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
  }
  .tcard:hover { border-color: var(--ink-faint); box-shadow: var(--shadow); }
  .tcard.dragging { opacity: 0.4; }
  .tcard.done .tcard-title { color: var(--ink-faint); text-decoration: line-through; }
  .tcard-title { font-size: 13px; line-height: 1.45; }
  .tcard-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .board .tcard { cursor: grab; }
  .board .tcard:active { cursor: grabbing; }
  .add-row .grow { flex: 1; }

  /* Calendar --------------------------------------------------------------
     Seven columns and whatever weeks the month spans. The rules are the gaps:
     the grid sits on a line-coloured ground and each cell paints over it, so
     there is one border between two days rather than two. */
  .cal-head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s3); }
  .cal-title { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .cal-nav { display: flex; gap: var(--s1); }
  .btn.sm.icon { padding: 3px 8px; line-height: 1.2; }

  /* Seven readable columns before seven cramped ones: below this the pane
     scrolls sideways rather than squeezing the cards to nothing. */
  .cal-scroll { overflow-x: auto; padding-bottom: var(--s2); }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 1px; background: var(--line);
    border: 1px solid var(--line); border-radius: var(--r); overflow: hidden;
    min-width: 720px;
  }
  .cal-dow {
    background: var(--bg); color: var(--ink-faint);
    padding: 6px var(--s2); text-align: center;
    font-size: 10.5px; font-weight: 650; letter-spacing: 0.07em; text-transform: uppercase;
  }

  .cal-day {
    background: var(--surface);
    display: flex; flex-direction: column; gap: 5px;
    padding: 5px 6px 7px;
    min-height: 116px; max-height: 260px; overflow-y: auto;
    transition: background 120ms ease, box-shadow 120ms ease;
  }
  /* Days outside the month and days already gone are quieter, not hidden: a
     task due last Friday is the one most worth seeing. */
  .cal-day.out { background: var(--bg); }
  .cal-day.past .cal-n { color: var(--ink-faint); }
  .cal-day.out .cal-n { color: var(--ink-faint); }
  .cal-day.today { background: var(--accent-soft); }
  .cal-day.today .cal-n { color: var(--accent); font-weight: 700; }
  .cal-day.over { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }

  .cal-daynum {
    position: sticky; top: 0; z-index: 1;
    display: flex; align-items: center; gap: 5px;
    background: inherit; padding-bottom: 2px;
  }
  .cal-n { font-size: 11.5px; font-weight: 600; color: var(--ink-dim); }
  .cal-mark {
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--accent);
  }
  /* Present but faint until the day is under the pointer: seven of these shouting
     at once would be louder than the tasks they sit above. */
  .cal-add {
    border: 0; background: none; color: var(--ink-faint);
    font-size: 12px; line-height: 1; padding: 1px 3px; cursor: default;
    opacity: 0; transition: opacity 120ms ease;
  }
  .cal-day:hover .cal-add, .cal-day:focus-within .cal-add { opacity: 1; }
  .cal-add:hover { color: var(--accent); }
  .cal-field {
    border: 1px solid var(--accent); background: var(--surface); color: var(--ink);
    border-radius: var(--r-sm); padding: 4px 6px; font-size: 12px; width: 100%; outline: none;
  }

  .cal-stack { display: flex; flex-direction: column; gap: 5px; }
  .cal-day .tcard { padding: 6px 7px; gap: 4px; cursor: grab; }
  .cal-day .tcard:active { cursor: grabbing; }
  .cal-day .tcard-title { font-size: 12px; line-height: 1.35; }
  .cal-more {
    border: 0; background: none; color: var(--ink-dim);
    font-size: 11px; text-align: left; padding: 1px 2px; cursor: default;
  }
  .cal-more:hover { color: var(--accent); }

  .cal-foot { display: flex; gap: var(--s2); margin-top: var(--s3); }

  /* Undated work, kept in sight rather than left out of the month. */
  .cal-tray {
    margin-top: var(--s4);
    background: var(--raised); border: 1px solid transparent;
    border-radius: var(--r); padding: var(--s2) var(--s3) var(--s3);
    transition: border-color 120ms ease, background 120ms ease;
  }
  .cal-tray.over { border-color: var(--accent); background: var(--accent-soft); }
  .cal-tray-head { display: flex; align-items: center; gap: 7px; padding: 4px 2px var(--s2); }
  .cal-hint { font-size: 11px; color: var(--ink-faint); }
  .cal-tray-body {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: var(--s2); align-items: start;
  }
  .cal-tray-body .tcard { cursor: grab; }
  .cal-tray-body .tcard:active { cursor: grabbing; }
  .cal-tray-body .tcol-empty { grid-column: 1 / -1; padding: var(--s3); }

  /* Task rows -------------------------------------------------------------
     What someone scans for and nothing else. Everything that used to be a button
     on the row is now a right click, so the row itself is the target. */
  .task { cursor: default; }
  .task:hover { background: var(--raised); }
  .t-title { font-size: 13.5px; line-height: 1.45; }
  .t-sub {
    display: flex; gap: var(--s3); margin-top: 2px;
    font-size: 11.5px; color: var(--ink-faint);
  }
  .t-ref { font-family: var(--mono); font-size: 11px; }
  /* Its own box so the dot hugs the project name instead of sitting a full
     sub-line gap away from it, where it would read as a bullet. */
  .t-owner { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .t-right { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; margin-left: var(--s3); }
  .t-due { font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; }
  .pill {
    font-size: 10.5px; font-weight: 650; letter-spacing: 0.02em;
    padding: 2px 8px; border-radius: 99px; white-space: nowrap;
    border: 1px solid transparent;
  }
  .pill.high    { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, transparent); }
  .pill.doing   { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .pill.blocked { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); }
  .pill.overdue { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); }
  /* Queued for an agent. Its own colour because it is not a status: a task can
     be queued and blocked at the same time. */
  .pill.queued { color: var(--accent); background: var(--accent-soft); font-family: var(--mono); font-size: 10px; }
  .t-more {
    width: 24px; height: 24px; flex: 0 0 24px; padding: 0;
    border: 0; border-radius: 6px; background: none;
    color: var(--ink-faint); font-size: 15px; line-height: 1; cursor: default;
    opacity: 0; transition: opacity 120ms ease, background 120ms ease;
  }
  .task:hover .t-more, .t-more:focus-visible { opacity: 1; }
  .t-more:hover { background: var(--line); color: var(--ink); }

  /* Right click menu */
  .ctx {
    position: fixed; z-index: 80; min-width: 190px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); box-shadow: var(--shadow);
    padding: 5px; display: flex; flex-direction: column;
  }
  .ctx-item {
    text-align: left; border: 0; background: none; cursor: default;
    padding: 7px 10px; border-radius: var(--r-sm); font-size: 13px; color: var(--ink);
  }
  .ctx-item:hover { background: var(--accent); color: #fff; }
  .ctx-item.danger { color: var(--crit); }
  .ctx-item.danger:hover { background: var(--crit); color: #fff; }
  .ctx-sep { height: 1px; background: var(--line-soft); margin: 4px 2px; }

  /* View picker ------------------------------------------------------------
     The trigger is a .btn carrying the current view, and the popup is the .ctx
     menu with wider rows. Every colour is a token, so the glyphs sit at
     currentColor and follow the ink of whichever theme is in force. */
  .vp-trigger { display: inline-flex; align-items: center; gap: var(--s2); padding: 6px 10px; }
  .vp-trigger-name { font-weight: 600; color: var(--ink); }
  .vp-caret { color: var(--ink-faint); font-size: 10px; line-height: 1; }
  .vp-trigger[aria-expanded="true"] { background: var(--raised); border-color: var(--ink-faint); }
  .vp-trigger .vp-glyph { width: 18px; height: 13px; }

  .ctx.vp {
    width: min(360px, calc(100vw - 24px));
    max-height: min(64vh, 540px); overflow-y: auto;
    padding: var(--s2);
  }
  .vp-group {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    color: var(--ink-faint); padding: var(--s2) var(--s2) var(--s1);
  }
  .vp-group + .vp-item { margin-top: 0; }

  .vp-item {
    display: flex; gap: var(--s3); align-items: flex-start; width: 100%; text-align: left;
    background: none; border: 1px solid transparent; border-radius: var(--r-sm);
    padding: var(--s2); cursor: default; color: var(--ink);
    transition: background 100ms ease;
  }
  /* Hover is the raised ground rather than the accent fill .ctx-item uses. At
     three lines a solid fill reads as the selection rather than as the pointer,
     and the row that is actually selected is the one wearing the accent. */
  .vp-item:hover { background: var(--raised); }
  .vp-item:focus-visible { background: var(--raised); }
  .vp-item:hover .vp-glyph { color: var(--ink-dim); }
  .vp-item.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .vp-item.on .vp-name, .vp-item.on .vp-glyph { color: var(--accent); }

  .vp-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .vp-name { display: flex; align-items: center; gap: var(--s2); font-weight: 600; line-height: 1.4; }
  .vp-desc { color: var(--ink-dim); font-size: 12px; line-height: 1.45; margin-top: 1px; }
  /* The reason a view is not here, in the same left rule the task detail uses,
     so it reads as a note about the row rather than as more of its description. */
  .vp-why {
    color: var(--ink-faint); font-size: 11.5px; line-height: 1.45;
    margin-top: 5px; padding-left: var(--s2); border-left: 2px solid var(--line);
  }
  .chip.vp-flag { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }
  .chip.vp-now { color: var(--accent); background: var(--accent-soft); }

  /* Unavailable: dimmed and inert, but still focusable, because the reason on
     the row is the whole point of showing it at all. */
  .vp-item.off { color: var(--ink-faint); }
  .vp-item.off .vp-name { color: var(--ink-dim); }
  .vp-item.off .vp-glyph { opacity: 0.45; }
  .vp-item.off:hover { background: none; }
  .vp-item.off:focus-visible { background: var(--raised); }

  /* Glyphs -----------------------------------------------------------------
     A shape per view, drawn from empty <i> marks. No icon font and no external
     file: the page runs under a strict CSP with no build step, so the shapes
     live here and the count of marks lives in app.js. */
  .vp-glyph {
    flex: 0 0 auto; width: 26px; height: 18px;
    display: flex; gap: 2px; color: var(--ink-faint);
    transition: color 100ms ease;
  }
  /* Nudged down to sit on the first line of the name rather than above it. */
  .vp-item > .vp-glyph { margin-top: 2px; }
  .vp-glyph i { display: block; flex: 1; background: currentColor; border-radius: 1.5px; }

  /* List: full width rows, ragged like text */
  .vp-glyph.rows { flex-direction: column; align-items: flex-start; }
  .vp-glyph.rows i { width: 100%; }
  .vp-glyph.rows i:nth-child(2) { width: 72%; }
  .vp-glyph.rows i:nth-child(3) { width: 86%; }

  /* Columns: three full height columns */
  .vp-glyph.cols i { height: 100%; }

  /* Board: the same columns, filled to different depths */
  .vp-glyph.board { align-items: flex-start; }
  .vp-glyph.board i { height: 100%; }
  .vp-glyph.board i:nth-child(2) { height: 62%; }
  .vp-glyph.board i:nth-child(3) { height: 40%; }

  /* Table: a grid of cells */
  .vp-glyph.grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; }
  .vp-glyph.cal  { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr; }
  .vp-glyph.cal i:nth-child(-n+4) { opacity: 0.45; }

  /* Doc: lines of text under a heading */
  .vp-glyph.doc { flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; }
  .vp-glyph.doc i { flex: 0 0 2px; width: 100%; }
  .vp-glyph.doc i:nth-child(1) { flex-basis: 3px; width: 58%; }
  .vp-glyph.doc i:nth-child(3) { width: 82%; }
  .vp-glyph.doc i:nth-child(4) { width: 46%; }

  /* Dashboard: a wide tile over two */
  .vp-glyph.dash { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; }
  .vp-glyph.dash i:nth-child(1) { grid-column: span 2; }

  /* Activity: a dot and a line per entry */
  .vp-glyph.feed { flex-direction: column; justify-content: center; gap: 4px; }
  .vp-glyph.feed i { flex: 0 0 3px; width: 100%; background: none; position: relative; }
  .vp-glyph.feed i::before {
    content: ""; position: absolute; left: 0; top: 0;
    width: 3px; height: 3px; border-radius: 50%; background: currentColor;
  }
  .vp-glyph.feed i::after {
    content: ""; position: absolute; left: 6px; right: 0; top: 1px;
    height: 1.5px; background: currentColor; opacity: 0.7;
  }
  .vp-glyph.feed i:nth-child(2)::after { right: 32%; }

  /* Gantt: bars starting at different points */
  .vp-glyph.gantt { flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; }
  .vp-glyph.gantt i { flex: 0 0 3px; }
  .vp-glyph.gantt i:nth-child(1) { width: 55%; }
  .vp-glyph.gantt i:nth-child(2) { width: 45%; margin-left: 26%; }
  .vp-glyph.gantt i:nth-child(3) { width: 34%; margin-left: 52%; }

  /* Timeline: points along one line */
  .vp-glyph.track { position: relative; align-items: center; justify-content: space-between; }
  .vp-glyph.track::before {
    content: ""; position: absolute; left: 1px; right: 1px; top: 50%;
    height: 1.5px; background: currentColor; opacity: 0.55;
  }
  .vp-glyph.track i { position: relative; flex: 0 0 6px; height: 6px; border-radius: 50%; }

  /* Form: two fields and a submit */
  .vp-glyph.form { flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; }
  .vp-glyph.form i {
    flex: 0 0 4px; width: 100%; background: none;
    border: 1.5px solid currentColor; border-radius: 2px;
  }
  .vp-glyph.form i:nth-child(3) { width: 46%; background: currentColor; }

  /* Workload: how full each person is */
  .vp-glyph.bars { align-items: flex-end; }
  .vp-glyph.bars i:nth-child(1) { height: 55%; }
  .vp-glyph.bars i:nth-child(2) { height: 100%; }
  .vp-glyph.bars i:nth-child(3) { height: 35%; }

  /* Team: people */
  .vp-glyph.people { align-items: center; justify-content: center; gap: 3px; }
  .vp-glyph.people i { flex: 0 0 7px; height: 7px; border-radius: 50%; }
  .vp-glyph.people i:nth-child(2) { flex-basis: 9px; height: 9px; }

  /* Mind map: a root and two branches */
  .vp-glyph.mind { position: relative; }
  .vp-glyph.mind i { position: absolute; flex: none; border-radius: 50%; }
  .vp-glyph.mind i:nth-child(1) { left: 0; top: 6px; width: 6px; height: 6px; }
  .vp-glyph.mind i:nth-child(2) { right: 0; top: 1px; width: 5px; height: 5px; }
  .vp-glyph.mind i:nth-child(3) { right: 0; bottom: 1px; width: 5px; height: 5px; }
  .vp-glyph.mind::before, .vp-glyph.mind::after {
    content: ""; position: absolute; left: 7px; width: 14px; height: 1.5px;
    background: currentColor; opacity: 0.6; transform-origin: left center;
  }
  .vp-glyph.mind::before { top: 8px; transform: rotate(-24deg); }
  .vp-glyph.mind::after  { top: 9px; transform: rotate(24deg); }

  /* Whiteboard: marks on a frame */
  .vp-glyph.canvas { position: relative; border: 1.5px solid currentColor; border-radius: 3px; }
  .vp-glyph.canvas i { position: absolute; flex: none; }
  .vp-glyph.canvas i:nth-child(1) { left: 3px; top: 3px; width: 6px; height: 6px; border-radius: 50%; opacity: 0.8; }
  .vp-glyph.canvas i:nth-child(2) { right: 3px; bottom: 4px; width: 9px; height: 3px; opacity: 0.8; }

/* ===========================================================================
   COLOUR AND RICHER SUBTASKS, styles.

   Three parts, and they go in three different places in index.html. See
   colour-subtasks.md. Nothing here hardcodes a colour outside the token
   blocks, and every hex in those blocks was picked against the ground of its
   own theme.
   =========================================================================== */


  /* Task colour ----------------------------------------------------------
     One class carries the choice and everything inside the element reads it
     from --task-colour, so a row, a card and a swatch are coloured by the same
     declaration rather than by three parallel sets of rules. */
  .c-blue   { --task-colour: var(--tc-blue); }
  .c-teal   { --task-colour: var(--tc-teal); }
  .c-green  { --task-colour: var(--tc-green); }
  .c-amber  { --task-colour: var(--tc-amber); }
  .c-orange { --task-colour: var(--tc-orange); }
  .c-red    { --task-colour: var(--tc-red); }
  .c-purple { --task-colour: var(--tc-purple); }
  .c-slate  { --task-colour: var(--tc-slate); }

  /* A spine rather than a background or a border. A border would move the text
     by three pixels the moment a colour was set, and a filled row would fight
     every pill already on it. */
  .tinted { position: relative; }
  .tinted::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--task-colour); border-radius: 3px 0 0 3px; pointer-events: none;
  }
  /* Cards sit on their own ground, so they can carry the colour as a wash as
     well. Rows cannot: a list of washed rows is a list nobody can read down. */
  .tcard.tinted, .subcard.tinted {
    background: color-mix(in srgb, var(--task-colour) 7%, var(--surface));
    border-color: color-mix(in srgb, var(--task-colour) 30%, var(--line));
  }
  .tcard.tinted:hover { border-color: color-mix(in srgb, var(--task-colour) 60%, var(--line)); }

  .swatches { display: flex; align-items: center; gap: 6px; padding: 7px 9px; }
  .swatch {
    width: 17px; height: 17px; flex: 0 0 17px; padding: 0;
    border-radius: 50%; border: 1.5px solid transparent;
    background: var(--task-colour); cursor: default;
    transition: transform 90ms ease, box-shadow 90ms ease;
  }
  .swatch:hover { transform: scale(1.14); }
  /* The current one reads as chosen through a ring rather than a tick, which at
     this size would be a smudge on half the palette. */
  .swatch.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-dim); }
  /* Clearing it. A slash, so it is not mistaken for a ninth colour. */
  .swatch.none {
    background: var(--surface); border-color: var(--ink-faint);
    background-image: linear-gradient(to top right,
      transparent calc(50% - 1px), var(--ink-faint) calc(50% - 1px),
      var(--ink-faint) calc(50% + 1px), transparent calc(50% + 1px));
  }
  .ctx .swatches { border-radius: var(--r-sm); }
  .swatch-inline {
    display: inline-flex; align-items: center;
    border: 1px solid var(--accent); border-radius: 8px;
    background: var(--bg); outline: none;
  }
  .swatch-inline .swatches { padding: 3px 7px; }
  .ts-chip.hue { border-color: color-mix(in srgb, var(--task-colour) 55%, var(--line)); }
  .ts-chip.hue .ts-chip-icon { color: var(--task-colour); }

  /* Subtask cards --------------------------------------------------------
     A subtask is a task, and a row said otherwise: it had room for a title and
     nothing that makes a subtask worth having. */
  .sub-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
    gap: var(--s3); margin-top: var(--s3);
  }
  .subcard {
    position: relative; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    padding: 10px 11px 9px; display: flex; flex-direction: column; gap: 7px;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .subcard:hover { box-shadow: var(--shadow); }
  .subcard.done { opacity: 0.72; }
  .subcard.done .subcard-title { color: var(--ink-faint); text-decoration: line-through; }
  .subcard-head { display: flex; align-items: flex-start; gap: var(--s2); }
  .subcard-title {
    flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0;
    font-size: 13.5px; font-weight: 550; line-height: 1.4; color: var(--ink); cursor: default;
  }
  .subcard-title:hover { color: var(--accent); }
  .subcard:hover .t-more, .subcard:focus-within .t-more { opacity: 1; }
  /* Two lines. Enough to tell one subtask from another, not enough to turn the
     grid into a wall of prose. */
  .subcard-note {
    margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-dim);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .subcard-foot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .subcard-who { display: flex; align-items: center; gap: 5px; margin-left: auto; min-width: 0; }
  .subcard-who .cell-text { max-width: 88px; }
  .subcard-hue {
    width: 14px; height: 14px; flex: 0 0 14px; padding: 0;
    border-radius: 50%; border: 1.5px dashed var(--ink-faint);
    background: transparent; cursor: default;
  }
  .subcard-hue:hover { border-color: var(--ink-dim); }
  .subcard-hue.on {
    background: var(--task-colour); border-style: solid;
    border-color: color-mix(in srgb, var(--task-colour) 55%, transparent);
  }

  /* The progress bar in the section head has more room than the one in a chip. */
  .ts-bar.wide { width: 88px; }

  /* Epics ------------------------------------------------------------------
     An organizer is a shell around a run of tasks, so it is drawn as the head of
     a card rather than as a card of its own. It sits on --bg, the way the table
     view's status groups do, which reads as a divider in the list rather than as
     another thing in it. Tokens only, so both themes follow. */
  .epic + .epic { margin-top: var(--s3); }
  .epic-head {
    display: flex; align-items: center; gap: var(--s2);
    padding: 8px var(--s3) 8px var(--s2);
    background: var(--bg);
    border-bottom: 1px solid var(--line-soft);
    cursor: default; -webkit-user-select: none; user-select: none;
  }
  .epic-head:hover { background: var(--raised); }
  /* The bucket for ungrouped work is not an epic, so it does not get an epic's
     weight: no colour, no progress, no menu. */
  .epic-head.loose { padding-left: var(--s4); }
  .epic-head.loose .epic-name { color: var(--ink-faint); font-weight: 600; }

  .epic-fold {
    border: 0; background: none; color: var(--ink-faint);
    width: 20px; height: 20px; flex: 0 0 20px; border-radius: var(--r-sm);
    display: grid; place-items: center; font-size: 10px; cursor: default;
  }
  .epic-fold:hover { color: var(--ink); background: var(--line-soft); }
  .epic-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 99px; }

  .epic-naming { flex: 1; min-width: 0; }
  .epic-name {
    font-size: 11.5px; font-weight: 650; letter-spacing: 0.05em; text-transform: uppercase;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .epic-sum {
    font-size: 11.5px; color: var(--ink-faint); margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .epic-n {
    font-size: 10.5px; font-weight: 700; color: var(--ink-faint);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .epic-n.empty { font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  /* Fixed width rather than proportional, so a column of epics has one baseline
     to compare along instead of a different scale per row. */
  .epic-bar {
    width: 64px; height: 4px; flex: 0 0 64px; border-radius: 99px;
    background: var(--line); overflow: hidden;
  }
  .epic-bar-fill { display: block; height: 100%; background: var(--good); border-radius: 99px; }

  .epic-more {
    border: 0; background: none; color: var(--ink-faint);
    padding: 2px 6px; border-radius: var(--r-sm); font-size: 14px; line-height: 1;
    cursor: default; opacity: 0; transition: opacity 100ms ease;
  }
  .epic-head:hover .epic-more, .epic-head:focus-within .epic-more { opacity: 1; }
  .epic-more:hover { color: var(--ink); background: var(--line-soft); }

  .epic-empty {
    padding: var(--s4); text-align: center;
    color: var(--ink-faint); font-size: 11.5px;
  }
  /* The same quiet input the board columns use, so adding into an epic and
     adding into a status look like one gesture rather than two features. */
  .epic-add {
    border: 0; border-top: 1px solid var(--line-soft); background: transparent;
    padding: 9px var(--s4); font-size: 12.5px; color: var(--ink);
    outline: none; width: 100%; border-radius: 0;
  }
  .epic-add::placeholder { color: var(--ink-faint); }
  .epic-add:focus { background: var(--bg); }

  /* Epics as a filter, above the layouts that already group by status. */
  .epic-strip {
    display: flex; flex-wrap: wrap; gap: var(--s2);
    margin-bottom: var(--s3);
  }
  .epic-chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim);
    border-radius: 99px; padding: 4px 11px; font-size: 12px; cursor: default;
    transition: border-color 100ms ease, background 100ms ease, color 100ms ease;
  }
  .epic-chip:hover { border-color: var(--ink-faint); color: var(--ink); }
  .epic-chip.on {
